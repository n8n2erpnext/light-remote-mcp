name: Gold Connection Lifecycle GC Source Gate

on:
  push:
    branches:
      - 'feat/gold-connection-gc-reconciler-20261029'
    paths:
      - 'lib/gold-connection-job-reaper.mjs'
      - 'lib/gold-execution-epoch.mjs'
      - 'lib/gold-device-short-id.mjs'
      - 'lib/gold-ab-v2-pending-redis.mjs'
      - 'deploy/scripts/selftest-gold-ab-v2-source.mjs'
      - 'deploy/scripts/selftest-gold-ab-v2-pending-redis.mjs'
      - 'platform-v2/sql/043_gold_device_short_ids.sql'
      - 'deploy/scripts/selftest-gold-p2i1-short-id.mjs'
      - 'deploy/scripts/ci-gold-p2i1-short-id-pg.mjs'
      - 'lib/gold-db.mjs'
      - 'deploy/scripts/apply-gold-db.mjs'
      - 'deploy/scripts/gold-g3-uat-cutover.sh'
      - 'deploy/scripts/selftest-gold-p2a-migration-lock.mjs'
      - 'deploy/scripts/selftest-gold-p2b-legacy-release-gates.mjs'
      - 'deploy/scripts/selftest-gold-p2b-four-service-orchestrator.mjs'
      - 'deploy/scripts/gold-p2b-clone-transaction.sh'
      - 'deploy/scripts/selftest-gold-p2b-clone-transaction.mjs'
      - 'deploy/scripts/gold-p2b-unknown-claim-audit.sql'
      - 'deploy/scripts/gold-p2b-audit-report.mjs'
      - 'deploy/scripts/selftest-gold-p2b-signed-quiescence.mjs'
      - 'deploy/scripts/selftest-gold-p2b-native-signed-boundary.mjs'
      - 'deploy/scripts/ci-gold-epoch-pg.mjs'
      - 'deploy/scripts/selftest-gold-signed-http-duplex-pg.mjs'
      - 'lib/gold-verified-channel-context.mjs'
      - 'lib/gold-p2b-signed-quiescence.mjs'
      - 'deploy/scripts/gold-p2b-four-service-orchestrator.mjs'
      - 'lib/gold-p2b-release-gate.mjs'
      - 'deploy/scripts/gold-m6-uat-four-service-cutover.sh'
      - 'deploy/scripts/gold-g3-uat-backup.sh'
      - 'deploy/scripts/gold-g3-uat-rollback.sh'
      - 'deploy/scripts/gold-g3-stage-candidate.sh'
      - 'device-agent/operator-agent.mjs'
      - 'device-agent/execution-epoch-journal.mjs'
      - 'operator-host/executor.mjs'
      - 'operator-host/executor-routes-device-channel.mjs'
      - 'lib/gold-reconnect-proof.mjs'
      - 'lib/gold-device-resource-locks.mjs'
      - 'operator-host/device-connection-registry.mjs'
      - 'deploy/scripts/selftest-gold-connection-*.mjs'
      - 'deploy/scripts/selftest-gold-reconnect-proof.mjs'
      - 'platform-v2/sql/040_gold_connection_job_gc_fences.sql'
      - 'platform-v2/sql/041_gold_device_execution_epoch.sql'
      - 'platform-v2/sql/migrations.lock.json'
      - 'deploy/scripts/selftest-gold-execution-epoch-*.mjs'
      - 'deploy/scripts/selftest-gold-gc-epoch-race-pg.mjs'
      - 'deploy/scripts/selftest-gold-gc-boundary-pg.mjs'
      - 'deploy/scripts/selftest-gold-p1-stale-claim-pg.mjs'
      - 'lib/gold-stale-claim-detector.mjs'
      - 'lib/gold-stale-claim-monitor.mjs'
      - 'deploy/scripts/selftest-gold-p1-stale-monitor-pg.mjs'
      - 'deploy/scripts/selftest-gold-p1-terminal-replay-pg.mjs'
      - 'device-agent/fleet-job-page.mjs'
      - 'deploy/scripts/selftest-gold-fleet-jobs-m6.mjs'
      - 'device-agent/local-wall.mjs'
      - 'device-agent/wall-account-notifications.mjs'
      - 'device-agent/fleet-wall-runtime.mjs'
      - 'plugin-server/site-announcements.mjs'
      - 'plugin-server/admin-portal/index.html'
      - 'platform-v2/sql/042_gold_wall_announcements_channel.sql'
      - 'deploy/scripts/selftest-gold-site-native.mjs'
      - 'deploy/scripts/selftest-gold-wall-account-notifications.mjs'
      - 'deploy/scripts/selftest-gold-p1-owner-recovery-wall.mjs'
      - 'deploy/scripts/ci-gold-epoch-pg.mjs'
      - 'deploy/scripts/selftest-gold-p1-e-load-chaos-pg.mjs'
      - 'deploy/scripts/selftest-gold-signed-http-duplex-pg.mjs'
      - 'lib/gold-verified-channel-context.mjs'
      - 'deploy/scripts/selftest-gold-real-agent-daemon-pg.mjs'
      - '.github/workflows/gold-connection-lifecycle-gc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify syntax and source-only safety invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/gold-connection-job-reaper.mjs
          node --check lib/gold-stale-claim-monitor.mjs
          node --check device-agent/fleet-job-page.mjs
          node deploy/scripts/selftest-gold-fleet-jobs-m6.mjs
          node --check device-agent/local-wall.mjs
          node --check device-agent/wall-account-notifications.mjs
          node --check device-agent/fleet-wall-runtime.mjs
          node --check plugin-server/site-announcements.mjs
          node deploy/scripts/selftest-gold-site-native.mjs
          node deploy/scripts/selftest-gold-wall-account-notifications.mjs
          node deploy/scripts/selftest-gold-wall-notifications-signed-proof.mjs
          node deploy/scripts/selftest-gold-p1-owner-recovery-wall.mjs
          node deploy/scripts/selftest-gold-m6-owner-orphan-recovery.mjs
          node --check deploy/scripts/selftest-gold-p1-e-load-chaos-pg.mjs
          node --check lib/gold-execution-epoch.mjs
          node --check lib/gold-verified-channel-context.mjs
          node --check lib/gold-device-short-id.mjs
          node --check lib/gold-ab-v2-pending-redis.mjs
          node --check deploy/scripts/selftest-gold-ab-v2-pending-redis.mjs
          node deploy/scripts/selftest-gold-ab-v2-source.mjs
          node --check deploy/scripts/ci-gold-p2i1-short-id-pg.mjs
          node deploy/scripts/selftest-gold-p2i1-short-id.mjs
          node --check lib/gold-db.mjs
          node --check deploy/scripts/apply-gold-db.mjs
          bash -n deploy/scripts/gold-g3-uat-cutover.sh
          node deploy/scripts/selftest-gold-p2a-migration-lock.mjs
          node deploy/scripts/selftest-gold-p2b-legacy-release-gates.mjs
          node --check deploy/scripts/gold-p2b-four-service-orchestrator.mjs
          node deploy/scripts/selftest-gold-p2b-four-service-orchestrator.mjs
          bash -n deploy/scripts/gold-p2b-clone-transaction.sh
          node deploy/scripts/selftest-gold-p2b-clone-transaction.mjs
          node --check lib/gold-p2b-signed-quiescence.mjs
          node --check deploy/scripts/gold-p2b-audit-report.mjs
          node deploy/scripts/selftest-gold-p2b-signed-quiescence.mjs
          node --check deploy/scripts/selftest-gold-p2b-native-signed-boundary.mjs
          node deploy/scripts/selftest-gold-p2b-native-signed-boundary.mjs
          node --check device-agent/execution-epoch-journal.mjs
          node --check device-agent/operator-agent.mjs
          node --check operator-host/executor-routes-device-channel.mjs
          node --check lib/gold-reconnect-proof.mjs
          node --check lib/gold-device-resource-locks.mjs
          node --check operator-host/executor.mjs
          node deploy/scripts/selftest-v09-device-connection.mjs
          node deploy/scripts/selftest-v11-device-connection-renewal.mjs
          node deploy/scripts/selftest-gold-connection-job-gc.mjs
          node deploy/scripts/selftest-gold-connection-gc-races.mjs
          node deploy/scripts/selftest-gold-reconnect-proof.mjs
          node deploy/scripts/selftest-gold-execution-epoch-wiring.mjs
          node deploy/scripts/selftest-gold-execution-epoch-agent-journal.mjs
          node deploy/scripts/selftest-gold-execution-epoch-native-process.mjs
          node deploy/scripts/selftest-gold-m6-terminal-replay.mjs
          node deploy/scripts/selftest-g3-duplex-reconnect-inflight.mjs
          node deploy/scripts/selftest-gold-m4-resource-policy.mjs
          node deploy/scripts/selftest-gold-job-control-stop.mjs
          node deploy/scripts/selftest-gold-job-control-durable-ack.mjs
          node deploy/scripts/selftest-gold-wall-job-cancel-gateway.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD~1 HEAD

  postgres-epoch-gc-races:
    name: PostgreSQL GC/epoch + P1-E (${{ matrix.devices }} simulated devices)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        devices: [1000, 10000]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Two Operator instances, real PostgreSQL 040+041, epoch and GC races
        env:
          LR_EPOCH_PG_TEST_ALLOW: '1'
          LR_P1E_TARGET: ${{ matrix.devices }}
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: fixture-ci-only
        run: node deploy/scripts/ci-gold-epoch-pg.mjs

  windows-agent-epoch-contract:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Windows Agent fsync journal, signed epoch and Poll Duplex gates
        shell: pwsh
        run: |
          node --check device-agent/operator-agent.mjs
          node --check device-agent/execution-epoch-journal.mjs
          node deploy/scripts/selftest-gold-execution-epoch-agent-journal.mjs
          node deploy/scripts/selftest-gold-execution-epoch-native-process.mjs
          node deploy/scripts/selftest-gold-execution-epoch-wiring.mjs
