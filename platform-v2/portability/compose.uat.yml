# Synthetic portability rehearsal only. No fixed project name, no host ports.
# Run exclusively with generated secret files and -p lr-uat-move-<random>-src/dst.
# Do not deploy this template as a production stack.
services:
  postgres:
    image: postgres:17-alpine
    pull_policy: never
    restart: "no"
    env_file:
      - ${LR_PORTABLE_PG_ENV:?UAT synthetic Postgres env required}
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 0.5
  redis:
    image: redis:8-alpine
    pull_policy: never
    restart: "no"
    # Docker daemon and CLI may have different /tmp mount namespaces. The
    # scratch host auth file stays 0600; as container root copy it into this
    # ephemeral writable layer, restrict it to redis:redis, then drop privileges
    # through the official Redis entrypoint. Never print the generated password.
    command:
      - sh
      - -ec
      - >-
        umask 077;
        cp /usr/local/etc/redis/redis.conf /tmp/lr-redis-uat.conf;
        chown redis:redis /tmp/lr-redis-uat.conf;
        chmod 0600 /tmp/lr-redis-uat.conf;
        exec docker-entrypoint.sh redis-server /tmp/lr-redis-uat.conf
    volumes:
      - redisdata:/data
      - ${LR_PORTABLE_REDIS_CONF:?UAT synthetic Redis config required}:/usr/local/etc/redis/redis.conf:ro
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -q NOAUTH"]
      interval: 2s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 0.2
volumes:
  pgdata:
  redisdata:
networks:
  private:
    internal: true
