name: Light Remote MCP unified baseline
on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-remote-baseline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: python
        run: |
          import os, subprocess
          base = os.environ.get('PR_BASE') or os.environ.get('BEFORE') or ''
          full = os.environ['EVENT'] == 'workflow_dispatch' or not base or set(base) == {'0'}
          paths = [] if full else subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          def doc(p):
              return p.endswith('.md') or p.startswith('docs/') or p in ['MASTER_CHECKPOINT.json','MIGRATION_PROVENANCE.json','feature-status.json']
          code = full or any(not doc(p) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('code=' + str(code).lower() + '\n')
  truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:truth
      - run: npm run check:docs
      - name: Enforce checkpoint + handoff + docs in each new commit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${PR_BASE:-${BEFORE:-}}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse HEAD^)"
          fi
          node deploy/unified/commit-sync-gate.mjs --range "$BASE" HEAD
  dependency-lock:
    name: Committed native dependency resolution
    needs: [changes, truth]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Owner-feature lock before expensive native builds
        shell: bash
        run: |
          set +e
          cargo metadata --manifest-path client/desktop-v4/src-tauri/Cargo.toml --features desktop-owner-login --format-version 1 --locked > "$RUNNER_TEMP/lr-cargo-metadata.json"
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            cargo metadata --manifest-path client/desktop-v4/src-tauri/Cargo.toml --features desktop-owner-login --format-version 1 > "$RUNNER_TEMP/lr-cargo-metadata.json"
            mkdir -p build-output/lock-resolution
            cp client/desktop-v4/src-tauri/Cargo.lock build-output/lock-resolution/Cargo.lock
            git diff -- client/desktop-v4/src-tauri/Cargo.lock > build-output/lock-resolution/changes.patch
            cargo --version > build-output/lock-resolution/toolchain.txt
            rustc --version >> build-output/lock-resolution/toolchain.txt
            sha256sum client/desktop-v4/src-tauri/Cargo.lock > build-output/lock-resolution/SHA256SUMS
            echo 'Generated lock is an unaccepted review candidate. Commit the reviewed lock before native builds.'
            exit 1
          fi
          git diff --exit-code -- client/desktop-v4/src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: light-remote-cargo-lock-candidate-${{ github.sha }}
          path: build-output/lock-resolution/
          if-no-files-found: warn
  core-contract-integration:
    name: Core, contracts, PostgreSQL/Redis integration
    needs: [changes, truth]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin-server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugin-server
      - name: Core unit and selected source regression tests
        run: npm test
      - name: PostgreSQL bootstrap readiness regression
        run: python3 -B -m unittest discover -s deploy/unified -p 'test_*.py'
      - name: Isolated actual backend and schema integration
        run: python3 deploy/unified/dev.py test
      - name: Record exact source manifest
        run: node deploy/unified/build-manifest.mjs --platform linux-core --out build-output/BUILD_MANIFEST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-remote-mcp-core-${{ github.sha }}
          path: build-output/
          if-no-files-found: error
  rm-native-build:
    name: RM native binary shared by stress and installer
    needs: [changes, truth, dependency-lock]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build one locked RM helper and isolated test fixture
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist/rmv2-ci-native'
          dotnet publish client/windows-native/GptOperator.RealRemoteV2/GptOperator.RealRemoteV2.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o (Join-Path $root 'helper')
          if ($LASTEXITCODE -ne 0) { throw 'Shared RM helper build failed' }
          dotnet publish client/windows-native/TestFixtures/Rmv2TextFixture/Rmv2TextFixture.csproj -c Release -r win-x64 --self-contained false -o (Join-Path $root 'fixture')
          if ($LASTEXITCODE -ne 0) { throw 'Isolated native text fixture build failed' }
          node deploy/unified/rmv2-native-artifact.mjs write $root $env:GITHUB_SHA (git rev-parse 'HEAD^{tree}') $env:GITHUB_RUN_ID (Get-Content VERSION -Raw).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Native source/hash manifest failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: rmv2-native-${{ github.sha }}
          path: dist/rmv2-ci-native/
          if-no-files-found: error
          retention-days: 14
  text-stress:
    needs: [changes, truth, rm-native-build]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/rmv2-text-stress.yml
    with:
      native_artifact: rmv2-native-${{ github.sha }}
    permissions:
      contents: read
  desktop:
    needs: [changes, truth, dependency-lock]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/desktop-v4-native-ci.yml
    permissions:
      contents: read
  windows:
    needs: [changes, truth, dependency-lock, rm-native-build]
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/windows-native-client.yml
    with:
      native_artifact: rmv2-native-${{ github.sha }}
    permissions:
      contents: read

  baseline-required:
    name: baseline-required
    needs: [changes, truth, dependency-lock, core-contract-integration, desktop, windows, rm-native-build, text-stress]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce the complete selected scope
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          code = jobs['changes']['outputs'].get('code') == 'true'
          required = ['changes','truth'] + (['dependency-lock','core-contract-integration','desktop','windows','rm-native-build','text-stress'] if code else [])
          failed = {name: jobs[name]['result'] for name in required if jobs[name]['result'] != 'success'}
          if failed:
              raise SystemExit('Required baseline scope failed: ' + json.dumps(failed))
          print('BASELINE_REQUIRED=PASS; scope=' + ('full' if code else 'documentation'))
