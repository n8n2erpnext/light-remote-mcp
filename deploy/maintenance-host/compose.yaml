services:
  maintenance:
    image: busybox:1.36-musl
    container_name: light-remote-maintenance
    restart: unless-stopped
    command: ["httpd","-f","-p","8080","-h","/www"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 24m
    pids_limit: 32
    ports: ["127.0.0.1:18081:8080"]
    volumes: ["./site:/www:ro"]
    healthcheck:
      test: ["CMD","wget","-q","-O","/dev/null","http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [default, netbird_netbird]
networks:
  netbird_netbird:
    external: true
