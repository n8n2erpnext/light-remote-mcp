name: Light Remote production release publication
on:
  push:
    tags: ['v[0-9]*']

permissions:
  actions: read
  contents: write

concurrency:
  group: light-remote-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'n8n2erpnext/light-remote-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Verify tagged version and protected branch ancestry
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          [[ "$GITHUB_REF_NAME" == "v$(tr -d '\r\n' < VERSION)" ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]]
          python3 - <<'PY'
          import runpy
          from pathlib import Path
          runpy.run_path('deploy/distribution/assemble-production-release.py')['production_profile'](Path('.'))
          PY
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Download successful CI artifacts for this exact commit
        run: |
          set -euo pipefail
          find_run(){
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs" \
              -f head_sha="$RELEASE_SHA" -f status=success -F per_page=20 \
              --jq '.workflow_runs | map(select(.head_branch == "main" or .head_branch == "work")) | first | .id // empty'
          }
          baseline=$(find_run ci.yml)
          packages=$(find_run release-candidate.yml)
          [[ "$baseline" =~ ^[0-9]+$ && "$packages" =~ ^[0-9]+$ ]]
          gh run download "$baseline" -n "light-remote-desktop-v4-COMPLETE-windows-x64-$RELEASE_SHA" -D "ci-artifacts/light-remote-desktop-v4-COMPLETE-windows-x64-$RELEASE_SHA"
          for arch in x64 arm64; do
            for platform in gpt-operator-linux light-remote-macos; do
              name="$platform-$arch-$RELEASE_SHA"
              gh run download "$packages" -n "$name" -D "ci-artifacts/$name"
            done
          done
          python3 deploy/distribution/assemble-production-release.py "$PWD" ci-artifacts release-assets \
            "$GITHUB_REF_NAME" "$RELEASE_SHA" "$baseline" "$packages"
      - name: Produce checksums and signing input
        run: |
          set -euo pipefail
          node deploy/scripts/build-client-update-manifest.mjs release-assets \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            release-assets/client-update-unsigned.json
          (cd release-assets && sha256sum -- * > SHA256SUMS.txt)
      - name: Publish the verified GitHub Release
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${args[@]}"
