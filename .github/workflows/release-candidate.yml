name: Light Remote native distribution candidates
on:
  push:
    branches: [main, work]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/linux-client-build.yml'
      - '.github/workflows/macos-client-build.yml'
      - 'deploy/scripts/selftest-v12-macos-rmv2-bridge.mjs'
      - '.github/workflows/production-release.yml'
      - 'deploy/distribution/**'
      - 'VERSION'
      - 'config/endpoints.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-remote-distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  distribution-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/distribution/selftest-production-release.py

  build-linux:
    uses: ./.github/workflows/linux-client-build.yml

  build-macos:
    uses: ./.github/workflows/macos-client-build.yml
