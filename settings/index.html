<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Light Remote — Settings</title><link rel="stylesheet" href="/assets/light-remote-portal.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="/assets/branding/light-remote-mark.svg"><span><strong>Light Remote</strong><small>Remote MCP</small></span></div><nav class="nav"><a href="/">▣ Devices</a><a href="/usage/">▥ Usage</a><a class="active" href="/settings/">⚙ Settings</a></nav></aside><main class="main"><div class="page-head"><div><h1>Settings</h1><p>Account identity and security.</p></div></div><section class="panel"><div class="panel-head"><h2>Account</h2></div><div id="account" class="device-row"><div>Loading…</div></div></section></main></div><script>fetch('/api/auth?action=me',{cache:'no-store'}).then(async r=>{if(!r.ok){location.href='/login/';return;}const j=await r.json();document.getElementById('account').innerHTML='<div><div class="device-name">'+String(j.account.email).replace(/[&<>]/g,'')+'</div><div class="device-sub">Plan '+String(j.account.plan||'free').toUpperCase()+' · Account '+String(j.account.accountId).replace(/[&<>]/g,'')+'</div></div>';});</script></body></html>
