name: Beta Release

on:
  push:
    tags:
      - 'v0.9.*-beta.*'
      - 'v0.9.0-rc.*'

permissions:
  contents: write

jobs:
  linux-client:
    uses: ./.github/workflows/linux-client-build.yml
  windows-client:
    uses: ./.github/workflows/windows-native-client.yml
  macos-client:
    uses: ./.github/workflows/macos-client-build.yml
  linux-server:
    uses: ./.github/workflows/server-linux-build.yml
  vercel-bridge:
    uses: ./.github/workflows/vercel-bridge-package.yml

  publish:
    needs: [linux-client, windows-client, macos-client, linux-server, vercel-bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify stable scope
        run: node deploy/scripts/selftest-v091-stable-scope.mjs
      - name: Verify golden release scope
        run: node deploy/scripts/selftest-v091-golden-release-scope.mjs
      - name: Verify canonical version plane
        run: node deploy/scripts/selftest-v10-version-plane-parity.mjs
      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          test "v$VERSION" = "$GITHUB_REF_NAME"
          mkdir -p release-assets
          find artifacts -type f -name 'Light-Remote-MCP-Client-Linux-*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'light-remote_*.deb' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'Light-Remote-Client-macOS-*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'Light-Remote-*.pkg' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'Light-Remote-MCP-Server-Linux-*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'Light-Remote-MCP-Vercel-Bridge-*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -type f -name 'Light-Remote-Fleet-Wall-*.tar.gz' -exec cp {} release-assets/ \;
          fleet_meta="$(find artifacts -type f -name 'fleet-wall-module-metadata.json' -print -quit)"
          test -n "$fleet_meta"; cp "$fleet_meta" release-assets/fleet-wall-module-metadata.json
          win="$(find artifacts -type f -name 'Light-Remote-MCP-Setup-x64.exe' -print -quit)"
          test -n "$win"; cp "$win" "release-assets/Light-Remote-MCP-Setup-x64-${VERSION}.exe"
          compact="$(find artifacts -type f -name 'Light-Remote-MCP-Compact-Setup-x64.exe' -print -quit)"
          test -n "$compact"; cp "$compact" "release-assets/Light-Remote-MCP-Compact-Setup-x64-${VERSION}.exe"
          installer="$(find artifacts -type f -name 'install.sh' -print -quit)"
          test -n "$installer"; cp "$installer" release-assets/install-linux-client.sh
          chmod 0755 release-assets/install-linux-client.sh
          test "$(find release-assets -maxdepth 1 -type f -name 'Light-Remote-MCP-Client-Linux-*.tar.gz' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'light-remote_*.deb' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'Light-Remote-Client-macOS-*.tar.gz' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'Light-Remote-*.pkg' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name 'Light-Remote-Fleet-Wall-*.tar.gz' | wc -l)" -eq 1
          cp docs/releases/RELEASE_BOM_0_9_1_BETA_3.md release-assets/RELEASE-BOM.md
          node -e 'const fs=require("fs");const version=process.argv[1];const row={schemaVersion:2,version,gitSha:process.env.GITHUB_SHA,goldenBaseline:{bomSha256:"17c9dea9bfc7db912fd301130ff53fc2b23dbd59ee727b62a6f2183ca5134596",vercelCommit:"3b2e2e67e099277da0eaca19746bc360a04503ed",wallAnchor:"57e641167572e4de9b794f9c783cc491aea42698",agentClientRegistryAnchor:"05c3bb1eb38121fb3b9ae0efee9682d02c884b4b",validatedWindowsBaseline:"0.9.1-beta.1@6b58ce1535d3054265626da622c0f152868f1c4e"},containsFixes:{lateResult410:"33ff0b4e69b919d920f053c87843dc5fd03c4267",lr1ClientContinuity:true,manualSessionCleanup:true,wallPolish:true,settingsClientCrashFix:true,windowsTaskMigrationFailClosed:true},compatibilityFloor:"0.9.0-rc.26",excluded:{computerUseRuntime:true,legacyNetlify:true}};fs.writeFileSync("release-assets/release-provenance.json",JSON.stringify(row,null,2)+"\n");' "$VERSION"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node deploy/scripts/build-client-update-manifest.mjs release-assets "$BASE_URL" release-assets/client-update-unsigned.json
          cat > release-assets/UPDATE-SIGNING-REQUIRED.txt <<EOF
          client-update-unsigned.json is NOT trusted by clients until it is signed by the owner release authority.
          Current deployment keeps the private update signing key on the owner-controlled ARM host with mode 0600.
          Never place the private key in GitHub Actions, Vercel, release assets, or client packages.
          Sign exact manifest bytes with client/sign-update-manifest.mjs, then promote with deploy/scripts/promote-client-update-channel.mjs.
          Promotion verifies signature, current version, all required platforms, and remote artifact size/SHA256 before staging channels/beta.
          EOF
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="docs/releases/RELEASE_NOTES_V0_9_0_RC.md"
          case "$GITHUB_REF_NAME" in
            v0.9.1-beta.3) NOTES_FILE="docs/releases/RELEASE_NOTES_V0_9_1_BETA_3.md" ;;
            v0.9.1-beta.2) NOTES_FILE="docs/releases/RELEASE_NOTES_V0_9_1_BETA_2.md" ;;
            v0.9.1-beta.1) NOTES_FILE="docs/releases/RELEASE_NOTES_V0_9_1_BETA_1.md" ;;
            *-beta.*) echo "No release notes mapping for $GITHUB_REF_NAME" >&2; exit 2 ;;
          esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Light Remote MCP $GITHUB_REF_NAME" \
            --notes-file "$NOTES_FILE" \
            --prerelease \
            --verify-tag
