name: Windows Native Client

on:
  push:
    branches:
      - codex/v0.9-client-packaging
      - codex/v0.9-device-policy-resume
      - main
    tags:
      - 'v0.9.*'
    paths:
      - 'client/**'
      - 'device-agent/**'
      - 'lib/device-proof.mjs'
      - '.github/workflows/windows-native-client.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Publish native tray client
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\windows\stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          dotnet publish client/windows-native/GptOperator.Client/GptOperator.Client.csproj `
            -c Release -r win-x64 --self-contained true -o $stage
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          $runtime = Join-Path $stage 'runtime'
          $agentRoot = Join-Path $stage 'agent'
          $agentDir = Join-Path $agentRoot 'device-agent'
          $adapterDir = Join-Path $agentDir 'platform-adapters'
          $libDir = Join-Path $agentRoot 'lib'
          $configDir = Join-Path $stage 'config'
          $licenseDir = Join-Path $stage 'licenses'
          $nodeLicenseDir = Join-Path $licenseDir 'node'
          $dotnetLicenseDir = Join-Path $licenseDir 'dotnet'
          New-Item -ItemType Directory -Force -Path $runtime,$agentDir,$adapterDir,$libDir,$configDir,$nodeLicenseDir,$dotnetLicenseDir | Out-Null
          $nodeExe = (Get-Command node.exe).Source
          $nodeRoot = Split-Path $nodeExe -Parent
          $dotnetExe = (Get-Command dotnet.exe).Source
          $dotnetRoot = Split-Path $dotnetExe -Parent
          Copy-Item $nodeExe (Join-Path $runtime 'node.exe')
          Copy-Item (Join-Path $nodeRoot 'LICENSE') (Join-Path $nodeLicenseDir 'LICENSE')
          Copy-Item (Join-Path $dotnetRoot 'LICENSE.txt') (Join-Path $dotnetLicenseDir 'LICENSE.txt')
          Copy-Item (Join-Path $dotnetRoot 'ThirdPartyNotices.txt') (Join-Path $dotnetLicenseDir 'ThirdPartyNotices.txt')
          Copy-Item device-agent/operator-agent.mjs $agentDir
          Copy-Item device-agent/platform-adapters/*.mjs $adapterDir
          Copy-Item lib/device-proof.mjs $libDir
          Copy-Item client/update-public.pem (Join-Path $configDir 'client-update-public.pem')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item NOTICE (Join-Path $stage 'NOTICE')
          Copy-Item THIRD_PARTY_DISTRIBUTION_NOTICES.md (Join-Path $stage 'THIRD_PARTY_DISTRIBUTION_NOTICES.md')
      - name: Native client bundled runtime smoke
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\windows\stage'
          $result = Join-Path $env:RUNNER_TEMP 'gpt-native-selftest.json'
          $exe = Join-Path $stage 'GptOperator.Client.exe'
          $node = Join-Path $stage 'runtime\node.exe'
          $agent = Join-Path $stage 'agent\device-agent\operator-agent.mjs'
          foreach ($notice in @('LICENSE','NOTICE','THIRD_PARTY_DISTRIBUTION_NOTICES.md','licenses\node\LICENSE','licenses\dotnet\LICENSE.txt','licenses\dotnet\ThirdPartyNotices.txt','THIRD_PARTY_NOTICES.txt')) {
            $noticePath = Join-Path $stage $notice
            if (-not (Test-Path $noticePath) -or (Get-Item $noticePath).Length -lt 100) { throw "bundled notice missing/empty: $notice" }
          }
          Write-Host 'windows-bundled-runtime-notices=PASS'
          $env:OPERATOR_AGENT_STATE = Join-Path $env:RUNNER_TEMP 'native-empty-device.json'
          Write-Host '--- bundled agent direct status ---'
          & $node $agent status
          if ($LASTEXITCODE -ne 0) { throw 'bundled agent direct status failed' }
          Write-Host '--- native client self-test ---'
          $self = Start-Process -FilePath $exe -ArgumentList @('--self-test-output',$result) -PassThru -Wait
          $selfExit = $self.ExitCode
          if (Test-Path $result) { Get-Content $result -Raw | Write-Host }
          if ($selfExit -ne 0) { throw "native client self-test failed exit=$selfExit" }
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "self-test not ok: $(Get-Content $result -Raw)" }
          if ($json.platformAdapter -ne 'win32') { throw "expected win32 adapter, got $($json.platformAdapter)" }
          if ($json.clientVersion -ne '0.9.0-beta.1') { throw "client version mismatch: $($json.clientVersion)" }
          Write-Host "windows-native-selftest=PASS agent=$($json.agentVersion) adapter=$($json.platformAdapter)"

          $manifestFixture = (Resolve-Path 'deploy/fixtures/client-update-test.json').Path
          $manifestHash = (Get-FileHash $manifestFixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -ne '48790b1532b863cb471bfcf68ff5f4a87fa0497e270bec5abbde254acf5d18e7') { throw "signed fixture byte hash changed: $manifestHash" }
          Write-Host "windows-signed-fixture-bytes=PASS sha256=$manifestHash"
          $sigResult = Join-Path $env:RUNNER_TEMP 'gpt-update-signature.json'
          $sig = Start-Process -FilePath $exe -ArgumentList @('--verify-update-fixture',$manifestFixture,(Resolve-Path 'deploy/fixtures/client-update-test.json.sig').Path,$sigResult) -PassThru -Wait
          if (Test-Path $sigResult) { Get-Content $sigResult -Raw | Write-Host }
          if ($sig.ExitCode -ne 0) { throw "signed update fixture verification failed exit=$($sig.ExitCode)" }
          $sigJson = Get-Content $sigResult -Raw | ConvertFrom-Json
          if (-not $sigJson.ok) { throw "update signature fixture invalid: $(Get-Content $sigResult -Raw)" }
          $tampered = Join-Path $env:RUNNER_TEMP 'client-update-tampered.json'
          (Get-Content deploy/fixtures/client-update-test.json -Raw).Replace('99.0.0','99.0.1') | Set-Content -LiteralPath $tampered -NoNewline -Encoding utf8
          $tamperedResult = Join-Path $env:RUNNER_TEMP 'tampered-result.json'
          $bad = Start-Process -FilePath $exe -ArgumentList @('--verify-update-fixture',$tampered,(Resolve-Path 'deploy/fixtures/client-update-test.json.sig').Path,$tamperedResult) -PassThru -Wait
          if ($bad.ExitCode -eq 0) { throw 'tampered update manifest was accepted' }
          Write-Host 'windows-native-update-signature=PASS tamper-rejected=PASS'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build per-user installer
        shell: pwsh
        run: |
          $stage = (Resolve-Path 'dist\windows\stage').Path
          $out = Join-Path $PWD 'dist\windows\installer'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & $env:ISCC "/DStageDir=$stage" "/DOutputDir=$out" "/DAppVersion=0.9.0-beta.1" client/windows-native/installer/GptOperator.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
          $installer = Join-Path $out 'Light-Remote-MCP-Setup-x64.exe'
          if (-not (Test-Path $installer)) { throw 'installer missing' }
          "WINDOWS_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install and migrate legacy Windows client
        timeout-minutes: 4
        shell: pwsh
        run: |
          $legacyName = 'GPTOperatorDeviceAgent'
          $legacyAction = New-ScheduledTaskAction -Execute (Join-Path $env:SystemRoot 'System32\cmd.exe') -Argument '/c ping 127.0.0.1 -t'
          $legacyTrigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddHours(1)
          $legacyPrincipal = New-ScheduledTaskPrincipal -UserId ([System.Security.Principal.WindowsIdentity]::GetCurrent().Name) -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName $legacyName -Action $legacyAction -Trigger $legacyTrigger -Principal $legacyPrincipal -Force | Out-Null
          Start-ScheduledTask -TaskName $legacyName
          Start-Sleep -Milliseconds 500

          $installDir = Join-Path $env:RUNNER_TEMP 'GPT Operator Installed'
          $dirArg = '/DIR="' + $installDir + '"'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',$dirArg)
          Write-Host "windows-native-install-start dir=$installDir"
          $p = Start-Process -FilePath $env:WINDOWS_INSTALLER -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'installer timed out after 120s' }
          if ($p.ExitCode -ne 0) { throw "installer exit=$($p.ExitCode)" }
          if (Get-ScheduledTask -TaskName $legacyName -ErrorAction SilentlyContinue) { throw 'legacy scheduled task survived native install' }
          $exe = Join-Path $installDir 'GptOperator.Client.exe'
          if (-not (Test-Path $exe)) { throw "installed client missing: $exe" }
          foreach ($notice in @('LICENSE','NOTICE','THIRD_PARTY_DISTRIBUTION_NOTICES.md','licenses\node\LICENSE','licenses\dotnet\LICENSE.txt','licenses\dotnet\ThirdPartyNotices.txt','THIRD_PARTY_NOTICES.txt')) {
            $noticePath = Join-Path $installDir $notice
            if (-not (Test-Path $noticePath) -or (Get-Item $noticePath).Length -lt 100) { throw "installed notice missing/empty: $notice" }
          }
          Write-Host 'windows-installed-runtime-notices=PASS'
          $rollback = Join-Path $env:LOCALAPPDATA 'GPTOperatorAgent\updates\rollback\GPT-Operator-Setup-0.9.0-beta.1-x64.exe'
          if (-not (Test-Path $rollback)) { throw "rollback installer cache missing: $rollback" }
          "WINDOWS_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_ROLLBACK=$rollback" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'windows-native-legacy-task-migration=PASS'

      - name: Installed native client self-test
        timeout-minutes: 2
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'installed-selftest.json'
          Write-Host 'windows-native-installed-selftest=start'
          $p = Start-Process -FilePath $env:WINDOWS_INSTALLED_EXE -ArgumentList @('--self-test-output',$result) -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'installed client self-test timed out after 30s' }
          if ($p.ExitCode -ne 0) { throw "installed client self-test failed exit=$($p.ExitCode)" }
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok -or $json.platformAdapter -ne 'win32') { throw "installed client invalid: $(Get-Content $result -Raw)" }
          Write-Host 'windows-native-installed-selftest=PASS'

      - name: Broken update rollback smoke
        timeout-minutes: 5
        shell: pwsh
        run: |
          $badInstaller = Join-Path $env:RUNNER_TEMP 'broken-update.exe'
          Copy-Item (Join-Path $env:SystemRoot 'System32\where.exe') $badInstaller -Force
          $helper = Join-Path $env:RUNNER_TEMP 'gpt-update-helper.exe'
          Copy-Item $env:WINDOWS_INSTALLED_EXE $helper -Force
          $updateLog = Join-Path $env:LOCALAPPDATA 'GPTOperatorAgent\logs\update.log'
          Remove-Item $updateLog -Force -ErrorAction SilentlyContinue
          Write-Host 'windows-native-update-rollback=start'
          $psi = [System.Diagnostics.ProcessStartInfo]::new($helper)
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.ArgumentList.Add('--apply-update')
          $psi.ArgumentList.Add($badInstaller)
          $psi.ArgumentList.Add($env:WINDOWS_INSTALL_DIR)
          $currentVersion = (Get-Content VERSION -Raw).Trim()
          $psi.ArgumentList.Add($currentVersion)
          $psi.ArgumentList.Add('0')
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $updateLog) { Get-Content $updateLog -Raw | Write-Host }
            throw 'rollback helper timed out after 180s'
          }
          if (Test-Path $updateLog) { Get-Content $updateLog -Raw | Write-Host }
          if ($p.ExitCode -ne 0) { throw "rollback helper failed exit=$($p.ExitCode)" }
          $updateText = Get-Content $updateLog -Raw
          $expected = 'apply_start current=' + [regex]::Escape($currentVersion)
          if ($updateText -notmatch $expected) { throw 'rollback helper argv were not preserved' }
          if ($updateText -notmatch 'rollback_success') { throw 'rollback success marker missing' }
          if (-not (Test-Path $env:WINDOWS_INSTALLED_EXE)) { throw 'installed client missing after rollback' }
          Write-Host 'windows-native-update-rollback=PASS'

      - name: Uninstall native Windows client
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          Get-Process -Name 'GptOperator.Client','gpt-update-helper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'GPTOperatorDeviceAgent' -Confirm:$false -ErrorAction SilentlyContinue
          $unins = Join-Path $env:WINDOWS_INSTALL_DIR 'unins000.exe'
          if (Test-Path $unins) {
            $p = Start-Process -FilePath $unins -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'uninstaller timed out after 60s' }
            if ($p.ExitCode -ne 0) { throw "uninstaller exit=$($p.ExitCode)" }
          }
          Write-Host 'windows-native-installer-roundtrip=PASS'
      - name: Hash Windows installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:WINDOWS_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          $sum = Join-Path (Split-Path $env:WINDOWS_INSTALLER -Parent) 'SHA256SUMS.txt'
          "$hash  Light-Remote-MCP-Setup-x64.exe" | Set-Content -LiteralPath $sum -Encoding ascii
          Write-Host "windows-native-installer-sha256=$hash"

      - name: Upload native Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: gpt-operator-native-windows-x64-${{ github.sha }}
          path: |
            dist/windows/installer/Light-Remote-MCP-Setup-x64.exe
            dist/windows/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
