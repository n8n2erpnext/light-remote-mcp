<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Light Remote — Sign in</title><link rel="stylesheet" href="/assets/light-remote-portal.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><img src="/assets/branding/light-remote-mark.svg" alt=""><div><strong>Light Remote</strong><div class="muted">Remote MCP</div></div></div><h1>Welcome back</h1><p>Sign in to manage your devices and AI access.</p><form id="form"><label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required autofocus></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label><div id="error" class="error"></div><div class="auth-actions"><button class="btn primary" type="submit">Sign in</button></div></form><div class="auth-switch">No account yet? <a href="/register/">Create account</a></div></section></main><script>
const form=document.getElementById('form'),error=document.getElementById('error');fetch('/api/auth?action=me',{cache:'no-store'}).then(r=>{if(r.ok)location.href='/';}).catch(()=>{});form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;error.textContent='';const fd=new FormData(form);try{const r=await fetch('/api/auth?action=login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:fd.get('email'),password:fd.get('password')})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Sign in failed');location.href='/';}catch(err){error.textContent=err.message;}finally{b.disabled=false;}};
</script></body></html>
