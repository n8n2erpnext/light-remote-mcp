name: RC50 MJS Scale UAT
on:
  push:
    branches: [feature/rc50-mjs-scale-20261011]
    paths: [platform-v2/**, operator-host/**, plugin-server/**, lib/**, package.json, package-lock.json, .github/workflows/rc50-mjs-scale.yml]
  pull_request:
    paths: [platform-v2/**, operator-host/**, plugin-server/**, lib/**, package.json, package-lock.json, .github/workflows/rc50-mjs-scale.yml]
  workflow_dispatch:
    inputs:
      require_ready:
        description: 'Enforce all five release P0 exit gates (fails closed until verified)'
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  isolated-data-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full platform and actual Operator/Plugin local regression
        run: node --test platform-v2/test/*.test.mjs
      - name: Real writer source gap audit and negative guards
        run: |
          python3 -B platform-v2/portability/audit_writer_freeze_readiness.py
          python3 -B platform-v2/test/test_writer_freeze_readiness.py
          python3 -B platform-v2/test/test_p0_release_gate.py
      - name: Publish finite P0 gate report (development does not claim READY)
        run: python3 -B platform-v2/scripts/p0-release-gate.py --report
      - name: Fail closed if release was requested without P0 acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.require_ready
        run: python3 -B platform-v2/scripts/p0-release-gate.py --require-ready
      - name: Create CI-only secrets (never committed)
        working-directory: platform-v2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          d=Path('secrets');d.mkdir(mode=0o700)
          (d/'postgres.env').write_text('POSTGRES_USER=lr_rc50_uat\nPOSTGRES_DB=light_remote_rc50_uat\nPOSTGRES_PASSWORD='+secrets.token_urlsafe(32)+'\nPOSTGRES_INITDB_ARGS=--auth-host=scram-sha-256\n')
          (d/'redis.conf').write_text('bind 0.0.0.0\nprotected-mode yes\nappendonly yes\nmaxmemory 256mb\nmaxmemory-policy noeviction\nrequirepass '+secrets.token_urlsafe(32)+'\n')
          (d/'postgres.env').chmod(0o600)
          (d/'redis.conf').chmod(0o644)
          PY
      - name: Bring up private UAT database
        working-directory: platform-v2
        run: docker compose -p lightremote-rc50-v2 -f compose.yml up -d --wait
      - name: PostgreSQL schema + rollback contracts
        working-directory: platform-v2
        run: |
          bash scripts/check.sh
      - name: Tear down only CI test stack
        if: always()
        working-directory: platform-v2
        run: docker compose -p lightremote-rc50-v2 -f compose.yml down -v --remove-orphans
