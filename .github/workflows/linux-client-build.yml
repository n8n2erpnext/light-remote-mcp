name: Linux Client Packages

on:
  push:
    branches:
      - codex/v0.9-client-packaging
      - codex/v0.9-device-policy-resume
    paths:
      - 'client/**'
      - 'device-agent/**'
      - 'lib/device-proof.mjs'
      - '.github/workflows/linux-client-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained package
        shell: bash
        env:
          NODE_VERSION: 22.23.2
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          OUT="$PWD/dist/linux/$TARGET_ARCH"
          PKG="$OUT/package"
          mkdir -p "$PKG/runtime" "$PKG/device-agent/platform-adapters" "$PKG/lib" "$PKG/client/linux" "$PKG/licenses/node"
          NODE_TAR="node-v${NODE_VERSION}-linux-${TARGET_ARCH}.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TAR}"
          grep "  ${NODE_TAR}$" SHASUMS256.txt | sha256sum -c -
          tar -xJf "$NODE_TAR"
          install -m 0755 "node-v${NODE_VERSION}-linux-${TARGET_ARCH}/bin/node" "$PKG/runtime/node"
          cp "node-v${NODE_VERSION}-linux-${TARGET_ARCH}/LICENSE" "$PKG/licenses/node/LICENSE"
          cp device-agent/operator-agent.mjs "$PKG/device-agent/"
          cp device-agent/linux-service-policy.mjs "$PKG/device-agent/"
          cp device-agent/platform-adapters/*.mjs "$PKG/device-agent/platform-adapters/"
          cp lib/device-proof.mjs "$PKG/lib/"
          cp client/linux/updater.mjs "$PKG/client/linux/"
          cp client/update-public.pem "$PKG/client/update-public.pem"
          cat > "$PKG/manifest.json" <<JSON
          {
            "product": "GPT Operator Linux ${TARGET_ARCH}",
            "version": "0.9.0-dev",
            "gitSha": "${GITHUB_SHA}",
            "node": "v${NODE_VERSION}",
            "platform": "linux-${TARGET_ARCH}",
            "builtAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          tar -czf "$OUT/GPT-Operator-Agent-Linux-${TARGET_ARCH}-dev.tar.gz" -C "$OUT" package
          (cd "$OUT" && sha256sum "GPT-Operator-Agent-Linux-${TARGET_ARCH}-dev.tar.gz") > "$OUT/SHA256SUMS.txt"
      - name: Package contract smoke
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          OUT="$PWD/dist/linux/$TARGET_ARCH"
          PKG="$OUT/package"
          test -x "$PKG/runtime/node"
          test -s "$PKG/licenses/node/LICENSE"
          test -f "$PKG/device-agent/operator-agent.mjs"
          test -f "$PKG/device-agent/linux-service-policy.mjs"
          test -f "$PKG/client/linux/updater.mjs"
          test -f "$PKG/manifest.json"
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          if [[ "$TARGET_ARCH" == "x64" ]]; then
            export OPERATOR_AGENT_STATE="$RUNNER_TEMP/gpt-empty-device.json"
            STATUS="$($PKG/runtime/node $PKG/device-agent/operator-agent.mjs status)"
            python3 - "$STATUS" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j['platformAdapter']=='linux',j
          assert not j['enrolled'],j
          print('linux-x64-agent-smoke=PASS')
          PY
          else
            file "$PKG/runtime/node" | grep -Eq 'ARM aarch64|aarch64'
            echo 'linux-arm64-runtime-architecture=PASS'
          fi
          bash -n client/linux/install.sh
          "$PKG/runtime/node" --check "$PKG/client/linux/updater.mjs" || [[ "$TARGET_ARCH" == "arm64" ]]
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: gpt-operator-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/linux/${{ matrix.arch }}/GPT-Operator-Agent-Linux-${{ matrix.arch }}-dev.tar.gz
            dist/linux/${{ matrix.arch }}/SHA256SUMS.txt
            client/linux/install.sh
          if-no-files-found: error
          retention-days: 14
