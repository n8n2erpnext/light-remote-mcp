name: Windows Agent Dev Build

on:
  push:
    branches:
      - codex/v0.9-platform-adapters
    paths:
      - 'device-agent/**'
      - 'lib/device-proof.mjs'
      - 'lib/operator-request.js'
      - 'operator-host/executor.mjs'
      - 'deploy/scripts/selftest-v09-*.mjs'
      - '.github/workflows/windows-agent-dev-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Node and adapter checks
        shell: pwsh
        run: |
          node --check device-agent/operator-agent.mjs
          node --check device-agent/platform-adapters/index.mjs
          node --check device-agent/platform-adapters/shared.mjs
          node --check device-agent/platform-adapters/linux.mjs
          node --check device-agent/platform-adapters/windows.mjs
          node deploy/scripts/selftest-v09-platform-adapters.mjs
          $env:OPERATOR_AGENT_STATE = Join-Path $env:RUNNER_TEMP 'empty-device.json'
          $status = (node device-agent/operator-agent.mjs status | Out-String) | ConvertFrom-Json
          if ($status.platformAdapter -ne 'win32') { throw "Expected win32 adapter, got $($status.platformAdapter)" }
          if ($status.enrolled) { throw 'Fresh Windows runner must not appear enrolled.' }
          Write-Host 'windows-agent-runtime-smoke=PASS'

      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $files = @(
            'device-agent/setup-windows-dev.ps1',
            'device-agent/install-windows-task.ps1',
            'device-agent/install-windows-service.ps1',
            'device-agent/windows-service-rights.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; throw "PowerShell parse failed: $file" }
          }
          Write-Host 'windows-powershell-parse=PASS'
          . ./device-agent/windows-service-rights.ps1
          $account = if ($env:USERDOMAIN) { "$env:USERDOMAIN\$env:USERNAME" } else { $env:USERNAME }
          $sid = Grant-GptServiceLogonRight -AccountName $account
          if (-not $sid.StartsWith('S-1-')) { throw "Service logon right SID invalid: $sid" }
          Write-Host "windows-service-logon-right=PASS sid=$sid"

      - name: Scheduled Task interactive-token smoke
        shell: pwsh
        run: |
          $taskName = "GPTOperatorTaskSmoke-$env:GITHUB_RUN_ID"
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $action = New-ScheduledTaskAction -Execute (Join-Path $env:SystemRoot 'System32\cmd.exe') -Argument '/c exit 0'
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $account
          $principal = New-ScheduledTaskPrincipal -UserId $account -LogonType Interactive -RunLevel Limited
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit ([TimeSpan]::Zero) -MultipleInstances IgnoreNew
          try {
            Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
            $registered = Get-ScheduledTask -TaskName $taskName
            if ([string]$registered.Principal.LogonType -ne 'Interactive') { throw "Interactive task principal missing: $($registered.Principal.LogonType)" }
            if ([string]$registered.Principal.RunLevel -ne 'Limited') { throw "Limited task run level missing: $($registered.Principal.RunLevel)" }
            Write-Host "windows-scheduled-task-interactive-token=PASS logon=$($registered.Principal.LogonType) runLevel=$($registered.Principal.RunLevel)"
          } finally { Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue }

      - name: Fetch pinned WinSW
        shell: pwsh
        run: |
          $url = 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe'
          $dest = Join-Path $env:RUNNER_TEMP 'WinSW-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $dest
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da'
          if ($actual -ne $expected) { throw "WinSW SHA256 mismatch: $actual" }
          "WINSW_PATH=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "winsw-sha256=$actual"

      - name: Assemble self-contained bundle
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'dist\GPT-Operator-Agent-Windows-x64'
          $agentDir = Join-Path $root 'device-agent'
          $adapterDir = Join-Path $agentDir 'platform-adapters'
          $libDir = Join-Path $root 'lib'
          $runtimeDir = Join-Path $root 'runtime'
          New-Item -ItemType Directory -Force -Path $agentDir,$adapterDir,$libDir,$runtimeDir | Out-Null
          Copy-Item device-agent/operator-agent.mjs $agentDir
          Copy-Item device-agent/setup-windows-dev.ps1 $agentDir
          Copy-Item device-agent/install-windows-task.ps1 $agentDir
          Copy-Item device-agent/install-windows-service.ps1 $agentDir
          Copy-Item device-agent/windows-service-rights.ps1 $agentDir
          Copy-Item device-agent/platform-adapters/index.mjs $adapterDir
          Copy-Item device-agent/platform-adapters/shared.mjs $adapterDir
          Copy-Item device-agent/platform-adapters/linux.mjs $adapterDir
          Copy-Item device-agent/platform-adapters/windows.mjs $adapterDir
          Copy-Item lib/device-proof.mjs $libDir
          Copy-Item $env:WINSW_PATH (Join-Path $agentDir 'winsw.exe')
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          Copy-Item $nodePath (Join-Path $runtimeDir 'node.exe')
          $bundledNode = Join-Path $runtimeDir 'node.exe'
          $env:OPERATOR_AGENT_STATE = Join-Path $env:RUNNER_TEMP 'bundle-empty-device.json'
          $bundleStatus = (& $bundledNode (Join-Path $agentDir 'operator-agent.mjs') status | Out-String) | ConvertFrom-Json
          if ($bundleStatus.platformAdapter -ne 'win32') { throw "Bundled Node/agent smoke failed: $($bundleStatus.platformAdapter)" }
          Write-Host 'windows-bundled-node-smoke=PASS'
          $nodeLicense = Join-Path (Split-Path $nodePath -Parent) 'LICENSE'
          if (Test-Path $nodeLicense) { Copy-Item $nodeLicense (Join-Path $runtimeDir 'NODE-LICENSE.txt') }
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/winsw/winsw/v2.12.0/LICENSE.txt' -OutFile (Join-Path $agentDir 'WINSW-LICENSE.txt')
          $startHere = @(
            '$ErrorActionPreference = ''Stop''',
            '& (Join-Path $PSScriptRoot ''device-agent\setup-windows-dev.ps1'')',
            'if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
          )
          $startHere | Set-Content -LiteralPath (Join-Path $root 'START-HERE.ps1') -Encoding UTF8
          $readme = @(
            'GPT Operator Agent - Windows x64 DEV BUILD', '',
            '1. Extract the ZIP to a normal folder.',
            '2. Open PowerShell as Administrator in that folder.',
            '3. Run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\START-HERE.ps1',
            '4. The setup opens the approval page and prints a one-time device code.',
            '5. Approve the device, then setup installs and starts GPTOperatorDeviceAgent.', '',
            'This is an unsigned development build. Device private keys remain local.',
            'DEV mode uses a per-user Scheduled Task with Interactive logon; no password/PIN is stored.',
            'The agent is online while the enrolled Windows user is signed in.'
          )
          $readme | Set-Content -LiteralPath (Join-Path $root 'README-WINDOWS-DEV.txt') -Encoding UTF8
          $manifest = [ordered]@{
            product = 'GPT Operator Agent Windows x64 DEV'
            version = '0.9.0-dev'
            gitSha = $env:GITHUB_SHA
            node = (& $nodePath --version)
            winsw = 'v2.12.0'
            winswSha256 = '05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da'
            builtAtUtc = [DateTime]::UtcNow.ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'manifest.json') -Encoding UTF8
          $zip = Join-Path $PWD 'dist\GPT-Operator-Agent-Windows-x64-dev.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content -LiteralPath (Join-Path $PWD 'dist\SHA256SUMS.txt') -Encoding ascii
          Write-Host "windows-bundle=$zip"
          Write-Host "windows-bundle-sha256=$zipHash"

      - name: Upload Windows dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpt-operator-agent-windows-x64-${{ github.sha }}
          path: |
            dist/GPT-Operator-Agent-Windows-x64-dev.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
