<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Light Remote — Reset password</title><link rel="icon" href="/account/assets/light-remote.ico" sizes="any"><script src="/account/assets/theme.js"></script><link rel="stylesheet" href="/account/assets/portal.css"></head><body>
<main class="auth-shell"><section class="auth-card auth-card-wide"><div class="auth-brand"><img src="/account/assets/light-remote-mark.svg" alt="LR"><div><strong>Light Remote</strong><div class="muted">Account recovery</div></div></div><div class="eyebrow">RECOVERY</div><h1 id="title">Reset your password</h1><p id="intro">Enter your account email. We will send a one-time reset link if the account exists.</p>
<form id="requestForm"><label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required autofocus></label><div id="requestMsg" class="setting-note"></div><div class="auth-actions"><button class="btn primary" type="submit">Send reset link</button></div></form>
<form id="completeForm" class="hide"><label class="field"><span>New password</span><input id="password" type="password" autocomplete="new-password" minlength="10" required></label><label class="field"><span>Confirm password</span><input id="confirm" type="password" autocomplete="new-password" minlength="10" required></label><div id="completeMsg" class="setting-note"></div><div class="auth-actions"><button class="btn primary" type="submit">Set new password</button></div></form>
<div class="auth-switch"><a href="/account/login">Back to sign in</a></div><div class="auth-security">Reset links are one-time, expire automatically, and invalidate older reset links for the same account.</div></section></main>
<script>
const qp=new URLSearchParams(location.search),token=qp.get('token')||'',requestForm=document.getElementById('requestForm'),completeForm=document.getElementById('completeForm');
if(token){requestForm.classList.add('hide');completeForm.classList.remove('hide');title.textContent='Choose a new password';intro.textContent='This one-time link will be consumed when your password is changed.';password.focus()}
requestForm.onsubmit=async ev=>{ev.preventDefault();const btn=ev.submitter;btn.disabled=true;requestMsg.className='setting-note muted';requestMsg.textContent='Sending…';try{const r=await fetch('/account/api?action=password-reset-request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value.trim()})});if(!r.ok)throw new Error('Unable to request reset');requestMsg.className='setting-note ok';requestMsg.textContent='If that account exists, a reset email is on the way.'}catch(e){requestMsg.className='setting-note error';requestMsg.textContent=e.message}finally{btn.disabled=false}};
completeForm.onsubmit=async ev=>{ev.preventDefault();const btn=ev.submitter;if(password.value!==confirm.value){completeMsg.className='setting-note error';completeMsg.textContent='Passwords do not match.';return}btn.disabled=true;completeMsg.className='setting-note muted';completeMsg.textContent='Updating…';try{const r=await fetch('/account/api?action=password-reset-complete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:password.value})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Reset failed');completeMsg.className='setting-note ok';completeMsg.textContent='Password updated. Redirecting…';setTimeout(()=>location.href='/account',550)}catch(e){completeMsg.className='setting-note error';completeMsg.textContent=e.message==='account_one_time_token_invalid'?'This reset link is invalid or expired.':e.message}finally{btn.disabled=false}};
</script></body></html>
