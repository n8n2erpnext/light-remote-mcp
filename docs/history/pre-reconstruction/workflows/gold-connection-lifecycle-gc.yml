          node deploy/scripts/selftest-linux-server-relink.mjs
          node deploy/scripts/selftest-device-agent-cli.mjs
          node deploy/scripts/selftest-gold-gc-revoked-ownerless.mjs
          node deploy/scripts/selftest-gold-connection-gc-races.mjs
          node deploy/scripts/selftest-gold-reconnect-proof.mjs
          node deploy/scripts/selftest-gold-execution-epoch-wiring.mjs
          node deploy/scripts/selftest-gold-execution-epoch-agent-journal.mjs
