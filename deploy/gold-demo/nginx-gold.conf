server {
  listen 8080;
  server_name gold.light-remote.thaiduy.digital;
  server_tokens off;
  client_max_body_size 12m;

  location / {
    proxy_pass http://10.192.135.61:5583;
    proxy_http_version 1.1;
    proxy_set_header Host gold.light-remote.thaiduy.digital;
    proxy_set_header X-Forwarded-Host gold.light-remote.thaiduy.digital;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Light-Remote-Environment "gold-uat-preview" always;
  }

  # G3 Device Duplex uses a streaming HTTP/1.1 POST request body.
  # Restrict unbuffered bidirectional transport to this Gold-only route.
  location = /device-channel/stream {
    proxy_pass http://10.192.135.61:5583;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host gold.light-remote.thaiduy.digital;
    proxy_set_header X-Forwarded-Host gold.light-remote.thaiduy.digital;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Light-Remote-Environment "gold-uat-preview" always;
  }
}
