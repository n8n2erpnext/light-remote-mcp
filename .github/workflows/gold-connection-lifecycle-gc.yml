  postgres-epoch-gc-races:
    name: PostgreSQL GC/epoch + P1-E (${{ matrix.devices }} simulated devices)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        devices: [1000, 10000]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Two Operator instances, real PostgreSQL 040+041, epoch and GC races
        env:
          LR_EPOCH_PG_TEST_ALLOW: '1'
          LR_P1E_TARGET: ${{ matrix.devices }}
          PGHOST: '127.0.0.1'
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: fixture-ci-only
        run: node deploy/scripts/ci-gold-epoch-pg.mjs

