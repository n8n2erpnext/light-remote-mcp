<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light Remote OS Input Acceptance</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#101418;color:#f2f2f2;font:24px system-ui,sans-serif}
main{text-align:center}button{font:inherit;padding:28px 44px;min-width:420px;border-radius:16px;border:2px solid #3a96dd;background:#18222d;color:#fff}
button[aria-pressed="true"]{border-color:#16c60c;background:#12331a}
input{display:block;box-sizing:border-box;width:520px;margin:24px auto 0;padding:16px 20px;border-radius:12px;border:2px solid #767676;background:#0c1116;color:#fff;font:22px system-ui,sans-serif}
input:focus{border-color:#3a96dd;outline:none}
output{display:block;margin-top:24px;font-size:18px}
</style>
</head>
<body>
<main>
<h1>Light Remote Real Windows E2E</h1>
<button id="accept" type="button" aria-label="Light Remote OS Input" aria-pressed="false">Light Remote OS Input</button>
<input id="text" type="text" aria-label="Light Remote Text Input" autocomplete="off" spellcheck="false">
<button id="keyboard" type="button" aria-label="Light Remote Keyboard Target">Keyboard Target</button>
<output id="state" role="status" aria-label="Light Remote Text Waiting">waiting</output>
</main>
<script>
const button=document.getElementById('accept');
const textInput=document.getElementById('text');
const keyboard=document.getElementById('keyboard');
const state=document.getElementById('state');
const expectedText='Tiếng Việt ✓';
const ctrlAText='CTRL+A OK';
button.addEventListener('click',()=>{
  button.setAttribute('aria-pressed','true');
  button.setAttribute('aria-label','Light Remote Accepted');
  button.textContent='Light Remote Accepted';
  state.textContent='accepted';
  document.title='Light Remote OS Input Accepted';
});
textInput.addEventListener('input',()=>{
  if(textInput.value===expectedText){
    textInput.setAttribute('aria-label','Light Remote Text Accepted');
    state.setAttribute('aria-label','Light Remote Text Accepted');
    state.textContent=expectedText;
    document.title='Light Remote Text Accepted';
  }
  if(textInput.value===ctrlAText){
    textInput.setAttribute('aria-label','Light Remote CtrlA Accepted');
    state.setAttribute('aria-label','Light Remote CtrlA Accepted');
    state.textContent=ctrlAText;
    document.title='Light Remote CtrlA Accepted';
  }
});
keyboard.addEventListener('focus',()=>{
  keyboard.setAttribute('aria-label','Light Remote Tab Accepted');
  state.setAttribute('aria-label','Light Remote Tab Accepted');
});
keyboard.addEventListener('keydown',(event)=>{
  if(event.key==='ArrowRight'){
    event.preventDefault();
    keyboard.setAttribute('aria-label','Light Remote Right Accepted');
    state.setAttribute('aria-label','Light Remote Right Accepted');
  }
});
keyboard.addEventListener('click',()=>{
  keyboard.setAttribute('aria-label','Light Remote Enter Accepted');
  state.setAttribute('aria-label','Light Remote Enter Accepted');
  state.textContent='keyboard accepted';
  document.title='Light Remote Keyboard Accepted';
});
</script>
</body>
</html>
