<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Light Remote — Settings</title><link rel="icon" href="/assets/branding/light-remote.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/assets/branding/light-remote-mark.svg"><link rel="stylesheet" href="/assets/light-remote-portal.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><img src="/assets/branding/light-remote-mark.svg"><span><strong>Light Remote</strong><small>Remote MCP</small></span></div><nav class="nav"><a href="/">▣ Devices</a><a href="/usage/">▥ Usage</a><a class="active" href="/settings/">⚙ Settings</a></nav></aside><main class="main"><div class="page-head"><div><h1>Settings</h1><p>Account identity, plan and activation.</p></div></div><div class="settings-grid"><section class="panel"><div class="panel-head"><h2>Account</h2><span id="planBadge" class="badge">…</span></div><div class="settings-body"><div class="setting-label">Email</div><div id="email" class="setting-value">Loading…</div><div class="setting-label">Plan</div><div id="plan" class="setting-value">—</div><div class="setting-label">Entitlement</div><div id="entitlement" class="setting-value muted">—</div></div></section><section class="panel"><div class="panel-head"><h2>Activate PRO / VIP</h2></div><div class="settings-body"><p class="muted">Redeem keys only on this official account portal. The key is attached to your account and is never stored on your devices.</p><form id="redeemForm" class="license-form"><input id="licenseKey" autocomplete="off" spellcheck="false" placeholder="LR-XXXX-XXXX-XXXX-XXXX-XXXX" maxlength="80" required><button class="btn primary" type="submit">Redeem key</button></form><div id="redeemMsg" class="setting-note"></div></div></section></div></main></div><script>
const clean=v=>String(v??'');const fmtDate=v=>v?new Date(v).toLocaleString():'No expiry';
function render(a){email.textContent=a.email||'';plan.textContent=(a.plan||'free').toUpperCase();planBadge.textContent=(a.plan||'free').toUpperCase();const e=a.entitlement||{};entitlement.textContent=(e.source||'default')+(e.validUntil?' · valid until '+fmtDate(e.validUntil):' · no expiry');}
async function load(){const r=await fetch('/api/auth?action=me',{cache:'no-store'});if(r.status===401){location.href='/login/';return;}const j=await r.json();if(!r.ok)throw new Error(j.error||'account_unavailable');render(j.account);}
redeemForm.onsubmit=async ev=>{ev.preventDefault();redeemMsg.className='setting-note muted';redeemMsg.textContent='Redeeming…';const key=licenseKey.value.trim();try{const r=await fetch('/api/auth?action=redeem-license',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key})});const j=await r.json();if(r.status===401){location.href='/login/';return;}if(!r.ok)throw new Error(j.error||'license_redeem_failed');render(j.account);licenseKey.value='';redeemMsg.className='setting-note ok';redeemMsg.textContent='Activated '+String(j.account?.plan||'').toUpperCase()+(j.account?.entitlement?.validUntil?' until '+fmtDate(j.account.entitlement.validUntil):'');}catch(e){redeemMsg.className='setting-note error';redeemMsg.textContent=e.message;}};load().catch(e=>{redeemMsg.className='setting-note error';redeemMsg.textContent=e.message;});
</script></body></html>
