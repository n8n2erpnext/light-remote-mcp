name: lightremote-rc50-v2
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./secrets/postgres.env
    command: ["postgres", "-c", "max_connections=120", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=384MB", "-c", "log_min_duration_statement=1500", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lr_rc50_uat -d light_remote_rc50_uat"]
      interval: 10s
      timeout: 4s
      retries: 10
    mem_limit: 768m
    cpus: 0.75
    stop_grace_period: 30s
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redisdata:/data
      - ./secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -q NOAUTH"]
      interval: 10s
      timeout: 4s
      retries: 10
    mem_limit: 384m
    cpus: 0.30
    stop_grace_period: 20s
volumes:
  pgdata:
  redisdata:
networks:
  private:
    internal: true
