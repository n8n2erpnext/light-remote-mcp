name: Light Remote native distribution candidates
on:
  push:
    branches: [main, work]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.github/workflows/production-release.yml'
      - 'deploy/distribution/**'
      - 'VERSION'
      - 'config/endpoints.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-remote-distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  distribution-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 deploy/distribution/selftest-production-release.py

  build-linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Build self-contained package
        shell: bash
        env:
          NODE_VERSION: 22.23.2
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          OUT="$PWD/dist/linux/$TARGET_ARCH"
          PKG="$OUT/package"
          mkdir -p "$PKG/runtime" "$PKG/client/linux" "$PKG/client/linux-debian/tray" "$PKG/licenses/node"
          NODE_TAR="node-v${NODE_VERSION}-linux-${TARGET_ARCH}.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TAR}"
          grep "  ${NODE_TAR}$" SHASUMS256.txt | sha256sum -c -
          tar -xJf "$NODE_TAR"
          install -m 0755 "node-v${NODE_VERSION}-linux-${TARGET_ARCH}/bin/node" "$PKG/runtime/node"
          cp "node-v${NODE_VERSION}-linux-${TARGET_ARCH}/LICENSE" "$PKG/licenses/node/LICENSE"
          npm ci --ignore-scripts
          node deploy/scripts/stage-client-core.mjs "$PKG"
          node deploy/scripts/stage-terminal-runtime.mjs "$PKG" linux "$TARGET_ARCH"
          cp device-agent/linux-service-policy.mjs "$PKG/device-agent/"
          cp client/linux/updater.mjs client/linux/update-lifeboat.mjs "$PKG/client/linux/"
          install -m 0755 client/linux/light-remote "$PKG/client/linux/light-remote"
          cp client/linux/cli-commands.sh client/linux/cli-status.mjs "$PKG/client/linux/"
          cp client/linux-debian/updater-wrapper.mjs "$PKG/client/linux-debian/"
          cp client/linux-debian/tray/light-remote-tray.py "$PKG/client/linux-debian/tray/"
          cp LICENSE NOTICE THIRD_PARTY_DISTRIBUTION_NOTICES.md "$PKG/"
          CORE_DIGEST="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).digest)" "$PKG/client-core.json")"
          cat > "$PKG/manifest.json" <<JSON
          {
            "product": "Light Remote Linux ${TARGET_ARCH}",
            "version": "${VERSION}",
            "gitSha": "${GITHUB_SHA}",
            "node": "v${NODE_VERSION}",
            "platform": "linux-${TARGET_ARCH}",
            "coreDigest": "${CORE_DIGEST}",
            "builtAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          tar -czf "$OUT/Light-Remote-MCP-Client-Linux-${TARGET_ARCH}-${VERSION}.tar.gz" -C "$OUT" package
          (cd "$OUT" && sha256sum "Light-Remote-MCP-Client-Linux-${TARGET_ARCH}-${VERSION}.tar.gz") > "$OUT/SHA256SUMS.txt"
      - name: Package contract smoke
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          OUT="$PWD/dist/linux/$TARGET_ARCH"
          PKG="$OUT/package"
          test -x "$PKG/runtime/node"
          test -s "$PKG/licenses/node/LICENSE"
          test -s "$PKG/LICENSE"
          test -s "$PKG/NOTICE"
          test -s "$PKG/THIRD_PARTY_DISTRIBUTION_NOTICES.md"
          node deploy/scripts/stage-client-core.mjs --verify "$PKG"
          node deploy/scripts/selftest-packaged-local-wall.mjs "$PKG"
          # Run privilege-policy contract checks before long G2/G3 lifecycle tests.
          node deploy/scripts/selftest-gold-linux-host-write-policy.mjs
          node deploy/scripts/selftest-device-agent-service.mjs
          node deploy/scripts/selftest-v09-linux-service-policy.mjs
          node deploy/scripts/selftest-infra-capability-catalog.mjs
          node deploy/scripts/selftest-docker-capability-refresh.mjs
          node deploy/scripts/selftest-gold-owner-permission-authorization.mjs
          node deploy/scripts/selftest-g2-pty-missing-exit.mjs
          node deploy/scripts/selftest-g2-transport-drop-job-survival.mjs
          node deploy/scripts/selftest-g2-pty-missing-pid-exit.mjs
          node deploy/scripts/selftest-g3-fleet-channel-stale-inflight.mjs
          node deploy/scripts/selftest-g3-duplex-halfopen-watchdog.mjs
          node deploy/scripts/selftest-g3-duplex-ready-timeout-diagnostic.mjs
          node deploy/scripts/selftest-g3-duplex-executor-rejection.mjs
          node deploy/scripts/selftest-g3-executor-hang-readiness.mjs
          node deploy/scripts/selftest-g3-duplex-reconnect-inflight.mjs
          node deploy/scripts/selftest-g3-executor-readiness-probe.mjs
          node deploy/scripts/selftest-g3-executor-probe-deadline.mjs
          node deploy/scripts/selftest-g3-signed-enrollment-executor-duplex.mjs
          node deploy/scripts/selftest-g3-local-wall-executor-readiness.mjs
          node deploy/scripts/selftest-g3-agent-daemon-lifecycle.mjs
          node deploy/scripts/selftest-device-agent-cli.mjs
          node deploy/scripts/selftest-v08-fleet-router.mjs
          node deploy/scripts/selftest-g2-posix-natural-exit-reap.mjs
          test -f "$PKG/client-core.json"
          test -f "$PKG/device-agent/operator-agent.mjs"
          test -f "$PKG/device-agent/fleet-component-manager.mjs"
          test -f "$PKG/device-agent/fleet-component-supervisor.mjs"
          test -f "$PKG/device-agent/linux-service-policy.mjs"
          test -f "$PKG/lib/device-proof.mjs"
          test -f "$PKG/lib/native-fs.mjs"
          test -f "$PKG/lib/native-process.mjs"
          test -f "$PKG/lib/native-terminal.mjs"
          test -s "$PKG/licenses/terminal-runtime/homebridge-node-pty-LICENSE"
          test -f "$PKG/lib/native-search.mjs"
          test -f "$PKG/lib/light-scp-file.mjs"
          test -f "$PKG/lib/light-scp-registry.mjs"
          test -f "$PKG/lib/update-contract.mjs"
          test -f "$PKG/lib/runtime-version.mjs"
          test -f "$PKG/client/linux/update-lifeboat.mjs"
          test -f "$PKG/client/linux/updater.mjs"
          test -x "$PKG/client/linux/light-remote"
          test -s "$PKG/client/linux/cli-commands.sh"
          test -s "$PKG/client/linux/cli-status.mjs"
          bash -n "$PKG/client/linux/light-remote"
          bash -n "$PKG/client/linux/cli-commands.sh"
          node --check "$PKG/client/linux/cli-status.mjs"
          test -f "$PKG/client/linux-debian/updater-wrapper.mjs"
          test -f "$PKG/client/linux-debian/tray/light-remote-tray.py"
          test -f "$PKG/assets/branding/light-remote-mark.svg"
          test -f "$PKG/assets/branding/light-remote-mark-256.png"
          test -f "$PKG/manifest.json"
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          if [[ "$TARGET_ARCH" == "x64" ]]; then
            export OPERATOR_AGENT_STATE="$RUNNER_TEMP/gpt-empty-device.json"
            STATUS="$($PKG/runtime/node $PKG/device-agent/operator-agent.mjs status)"
            python3 - "$STATUS" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j['platformAdapter']=='linux',j
          assert not j['enrolled'],j
          print('linux-x64-agent-smoke=PASS')
          PY
          else
            file "$PKG/runtime/node" | grep -Eq 'ARM aarch64|aarch64'
            echo 'linux-arm64-runtime-architecture=PASS'
          fi
          node deploy/scripts/terminal-runtime-smoke.mjs "$PKG"
          bash -n client/linux/install.sh
          "$PKG/runtime/node" --check "$PKG/client/linux/updater.mjs"
      - name: Build Debian package
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          OUT="$PWD/dist/linux/$TARGET_ARCH"
          BUNDLE="$OUT/Light-Remote-MCP-Client-Linux-${TARGET_ARCH}-${VERSION}.tar.gz"
          client/linux-debian/build-deb.sh "$BUNDLE" "$OUT/deb"
          DEB_ARCH=$([[ "$TARGET_ARCH" == x64 ]] && echo amd64 || echo arm64)
          DEB="$OUT/deb/light-remote_${VERSION}_${DEB_ARCH}.deb"
          test -s "$DEB"
          DEB_INFO="$RUNNER_TEMP/light-remote-${DEB_ARCH}.info"
          DEB_CONTENTS="$RUNNER_TEMP/light-remote-${DEB_ARCH}.contents"
          dpkg-deb -I "$DEB" > "$DEB_INFO"
          dpkg-deb -c "$DEB" > "$DEB_CONTENTS"
          grep -Fq 'Package: light-remote' "$DEB_INFO"
          grep -Fq 'light-remote-agent.service' "$DEB_CONTENTS"
          grep -Fq 'client/linux-debian/updater-wrapper.mjs' "$DEB_CONTENTS"
          sha256sum "$DEB" >> "$OUT/SHA256SUMS.txt"
          echo "debian-${DEB_ARCH}-package-contract=PASS"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: gpt-operator-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/linux/${{ matrix.arch }}/Light-Remote-MCP-Client-Linux-${{ matrix.arch }}-*.tar.gz
            dist/linux/${{ matrix.arch }}/SHA256SUMS.txt
            dist/linux/${{ matrix.arch }}/deb/*.deb
          if-no-files-found: error
          retention-days: 14
  build-macos:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            node_arch: x64
            swift_target: x86_64-apple-macos11.0
            pkg_arch: x86_64
          - arch: arm64
            runner: macos-15
            node_arch: arm64
            swift_target: arm64-apple-macos11.0
            pkg_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Build macOS 11+ client package
        shell: bash
        env:
          NODE_VERSION: 22.23.2
          TARGET_ARCH: ${{ matrix.arch }}
          NODE_ARCH: ${{ matrix.node_arch }}
          SWIFT_TARGET: ${{ matrix.swift_target }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          OUT="$PWD/dist/macos/$TARGET_ARCH"
          PKG="$OUT/package"
          mkdir -p "$PKG/runtime" "$PKG/client/macos" "$PKG/licenses/node" "$PKG/tray" "$PKG/real-remote"
          NODE_TAR="node-v${NODE_VERSION}-darwin-${NODE_ARCH}.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TAR}"
          grep "  ${NODE_TAR}$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "$NODE_TAR"
          install -m 0755 "node-v${NODE_VERSION}-darwin-${NODE_ARCH}/bin/node" "$PKG/runtime/node"
          cp "node-v${NODE_VERSION}-darwin-${NODE_ARCH}/LICENSE" "$PKG/licenses/node/LICENSE"
          npm ci --ignore-scripts
          node deploy/scripts/selftest-v12-macos-rmv2-bridge.mjs
          node deploy/scripts/selftest-v12-macos-physical-type-routing.mjs
          node deploy/scripts/selftest-v12-macos-codex-cursor.mjs
          node deploy/scripts/selftest-v12-rm-cursor-effect-parity.mjs
          node deploy/scripts/selftest-macos-gui-optin.mjs
          node deploy/scripts/selftest-macos-robot-settings.mjs
          node deploy/scripts/selftest-v10-version-plane-parity.mjs
          plutil -lint client/macos/real-remote/robot-app/Info.plist
          bash -n client/macos/real-remote/robot-app/build-robot-app.sh
          node deploy/scripts/stage-client-core.mjs "$PKG"
          node deploy/scripts/stage-terminal-runtime.mjs "$PKG" darwin "$TARGET_ARCH"
          cp client/macos/updater.mjs client/macos/update-lifeboat.mjs "$PKG/client/macos/"
          cp LICENSE NOTICE THIRD_PARTY_DISTRIBUTION_NOTICES.md "$PKG/"
          xcrun swiftc -O -target "$SWIFT_TARGET" client/macos/tray/main.swift -o "$PKG/tray/LightRemoteTray"
          xcrun swiftc -O -target "$SWIFT_TARGET" client/macos/launcher/main.swift -o "$PKG/tray/LightRemoteLauncher"
          xcrun swiftc -O -target "$SWIFT_TARGET" client/macos/real-remote/main.swift client/macos/real-remote/SemanticEngine.swift client/macos/real-remote/RobotCursorMotion.swift client/macos/real-remote/RobotCursorOverlay.swift client/macos/real-remote/DevPermissions.swift -o "$PKG/real-remote/LightRemoteRealRemote"
          chmod 0755 "$PKG/tray/LightRemoteTray" "$PKG/tray/LightRemoteLauncher" "$PKG/real-remote/LightRemoteRealRemote"
          # Native RM active-indicator identity for bare-helper deployments.
          # The separate Dev .app embeds its own .icns; production helpers
          # load the identical RM logo from this adjacent package resource.
          install -m 0644 client/macos/real-remote/Resources/LightRemoteRM-256.png "$PKG/real-remote/LightRemoteRM-256.png"
          test -s "$PKG/real-remote/LightRemoteRM-256.png"
          CORE_DIGEST="$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).digest)" "$PKG/client-core.json")"
          cat > "$PKG/manifest.json" <<JSON
          {
            "product": "Light Remote macOS ${TARGET_ARCH}",
            "version": "$VERSION",
            "gitSha": "${GITHUB_SHA}",
            "node": "v${NODE_VERSION}",
            "platform": "macos-${TARGET_ARCH}",
            "coreDigest": "${CORE_DIGEST}",
            "minimumMacOS": "11.0",
            "builtAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          tar -czf "$OUT/Light-Remote-Client-macOS-${TARGET_ARCH}-${VERSION}.tar.gz" -C "$OUT" package
          (cd "$OUT" && shasum -a 256 "Light-Remote-Client-macOS-${TARGET_ARCH}-${VERSION}.tar.gz") > "$OUT/SHA256SUMS.txt"
      - name: Package contract and Big Sur target smoke
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          OUT="$PWD/dist/macos/$TARGET_ARCH"; PKG="$OUT/package"
          node deploy/scripts/stage-client-core.mjs --verify "$PKG"
          node deploy/scripts/selftest-packaged-local-wall.mjs "$PKG"
          test -f "$PKG/client-core.json"
          test -x "$PKG/runtime/node"
          test -x "$PKG/tray/LightRemoteTray"
          test -x "$PKG/tray/LightRemoteLauncher"
          test -x "$PKG/real-remote/LightRemoteRealRemote"
          "$PKG/real-remote/LightRemoteRealRemote" --self-test | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["ok"] and d["runtime"]=="real-remote-v2-macos",d; print("macos-real-remote-native-helper-smoke=PASS")'
          node deploy/scripts/macos-native-rmv2-smoke.mjs "$PKG/real-remote/LightRemoteRealRemote"
          test -f "$PKG/assets/branding/light-remote-mark-256.png"
          test -f assets/branding/light-remote-mark-512.png
          test -f "$PKG/device-agent/platform-adapters/macos.mjs"
          test -f "$PKG/lib/native-terminal.mjs"
          test -s "$PKG/licenses/terminal-runtime/node-pty-LICENSE"
          node deploy/scripts/terminal-runtime-smoke.mjs "$PKG"
          node deploy/scripts/selftest-g2-runtime-shutdown-cleanup.mjs
          node deploy/scripts/selftest-g3-duplex-halfopen-watchdog.mjs
          node deploy/scripts/selftest-g3-duplex-ready-timeout-diagnostic.mjs
          node deploy/scripts/selftest-g3-duplex-executor-rejection.mjs
          node deploy/scripts/selftest-g3-executor-hang-readiness.mjs
          node deploy/scripts/selftest-g3-duplex-reconnect-inflight.mjs
          node deploy/scripts/selftest-g3-executor-readiness-probe.mjs
          node deploy/scripts/selftest-g3-executor-probe-deadline.mjs
          node deploy/scripts/selftest-g3-signed-enrollment-executor-duplex.mjs
          node deploy/scripts/selftest-g3-local-wall-executor-readiness.mjs
          node deploy/scripts/selftest-g3-agent-daemon-lifecycle.mjs
          test -f "$PKG/device-agent/fleet-component-manager.mjs"
          test -f "$PKG/device-agent/fleet-component-supervisor.mjs"
          for lib in device-proof.mjs native-fs.mjs native-process.mjs native-search.mjs light-scp-file.mjs light-scp-registry.mjs update-contract.mjs runtime-version.mjs; do test -f "$PKG/lib/$lib"; done
          test -f "$PKG/client/macos/updater.mjs"
          test -f "$PKG/client/macos/update-lifeboat.mjs"
          node --check client/macos/updater.mjs
          node --check client/macos/update-lifeboat.mjs
          bash -n client/macos/build-pkg.sh
          bash -n client/macos/uninstall.sh
          plutil -lint client/macos/launchd/*.plist
          file "$PKG/runtime/node" "$PKG/tray/LightRemoteTray" "$PKG/tray/LightRemoteLauncher"
          otool -l "$PKG/tray/LightRemoteTray" | grep -A5 LC_BUILD_VERSION | grep -q 'minos 11.0'
          otool -l "$PKG/tray/LightRemoteLauncher" | grep -A5 LC_BUILD_VERSION | grep -q 'minos 11.0'
          (cd "$OUT" && shasum -a 256 -c SHA256SUMS.txt)
          if [[ "$TARGET_ARCH" == x64 ]]; then
            export OPERATOR_AGENT_STATE="$RUNNER_TEMP/light-remote-empty-device.json"
            STATUS="$($PKG/runtime/node $PKG/device-agent/operator-agent.mjs status)"
            python3 - "$STATUS" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1]); assert j['platformAdapter']=='darwin',j; assert not j['enrolled'],j
          print('macos-x64-agent-smoke=PASS')
          PY
          else
            file "$PKG/runtime/node" | grep -q arm64
            echo 'macos-arm64-runtime-architecture=PASS'
          fi
      - name: Build installer pkg
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          BUNDLE="$PWD/dist/macos/$TARGET_ARCH/Light-Remote-Client-macOS-${TARGET_ARCH}-${VERSION}.tar.gz"
          client/macos/build-pkg.sh "$BUNDLE" "$PWD/dist/macos/$TARGET_ARCH/pkg"
          PKGFILE="$PWD/dist/macos/$TARGET_ARCH/pkg/Light-Remote-${VERSION}-${{ matrix.pkg_arch }}.pkg"
          test -s "$PKGFILE"
          pkgutil --check-signature "$PKGFILE" || true
          PAYLOAD="$(pkgutil --payload-files "$PKGFILE")"
          grep -Fq 'Library/Application Support/Light Remote/releases' <<<"$PAYLOAD"
          grep -Fq 'Applications/Light Remote.app/Contents/Info.plist' <<<"$PAYLOAD"
          grep -Fq 'Applications/Light Remote.app/Contents/MacOS/LightRemoteLauncher' <<<"$PAYLOAD"
          grep -Fq 'Applications/Light Remote.app/Contents/Resources/LightRemote.icns' <<<"$PAYLOAD"
          grep -Fq 'Applications/Light Remote.app/Contents/Helpers/Light Remote Robot.app/Contents/Info.plist' <<<"$PAYLOAD"
          grep -Fq 'Applications/Light Remote.app/Contents/Helpers/Light Remote Robot.app/Contents/MacOS/LightRemoteRealRemote' <<<"$PAYLOAD"
          grep -Fq 'Applications/Light Remote.app/Contents/Helpers/Light Remote Robot.app/Contents/Resources/LightRemoteRM.icns' <<<"$PAYLOAD"
          grep -Fq 'Applications/Light Remote.app/Contents/Resources/uninstall.sh' <<<"$PAYLOAD"
          EXPANDED="$RUNNER_TEMP/light-remote-pkg-$TARGET_ARCH"; rm -rf "$EXPANDED"
          pkgutil --expand "$PKGFILE" "$EXPANDED"
          grep -Fq "com.lightremote.client.macos-$TARGET_ARCH" "$EXPANDED/PackageInfo"
          grep -Fq 'http://127.0.0.1:5491/' "$EXPANDED/Scripts/postinstall"
          grep -Fq 'launchctl print' "$EXPANDED/Scripts/postinstall"
          grep -Fq 'WALL_OK' "$EXPANDED/Scripts/postinstall"
          echo "macos-system-package-receipt=PASS id=com.lightremote.client.macos-$TARGET_ARCH"
          echo "macos-local-wall-postinstall-gate=PASS"
          [[ "$(plutil -extract KeepAlive raw client/macos/launchd/com.lightremote.tray.plist)" == false ]]
          shasum -a 256 "$PKGFILE" >> "$PWD/dist/macos/$TARGET_ARCH/SHA256SUMS.txt"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: light-remote-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/macos/${{ matrix.arch }}/Light-Remote-Client-macOS-${{ matrix.arch }}-*.tar.gz
            dist/macos/${{ matrix.arch }}/pkg/*.pkg
            dist/macos/${{ matrix.arch }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
