name: Windows Tray Client

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/real-remote'
    tags:
      - 'v0.9.*'
    paths:
      - 'VERSION'
      - 'client/**'
      - 'device-agent/**'
      - 'lib/device-proof.mjs'
      - 'lib/native-fs.mjs'
      - 'lib/native-process.mjs'
      - 'lib/native-terminal.mjs'
      - 'lib/native-search.mjs'
      - 'lib/native-desktop.mjs'
      - 'lib/light-scp-file.mjs'
      - 'lib/light-scp-registry.mjs'
      - 'lib/update-contract.mjs'
      - 'lib/runtime-version.mjs'
      - 'lib/version-compat.mjs'
      - 'lib/brand.mjs'
      - 'lib/update-helper-reconcile.mjs'
      - 'deploy/scripts/stage-client-core.mjs'
      - 'deploy/scripts/stage-terminal-runtime.mjs'
      - 'deploy/scripts/terminal-runtime-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'client/core-files.json'
      - 'assets/branding/**'
      - '.github/workflows/windows-native-client.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-install-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Publish native tray client
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\windows\stage'
          $updaterStage = Join-Path $PWD 'dist\windows\updater'
          New-Item -ItemType Directory -Force -Path $stage,$updaterStage | Out-Null
          dotnet publish client/windows-native/GptOperator.Client/GptOperator.Client.csproj `
            -c Release -r win-x64 --self-contained true -o $stage
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish client failed' }
          dotnet publish client/windows-native/LightRemote.Updater/LightRemote.Updater.csproj `
            -c Release -r win-x64 --self-contained true -o $updaterStage
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish updater failed' }
          $updaterConfig = Join-Path $updaterStage 'config'
          New-Item -ItemType Directory -Force -Path $updaterConfig | Out-Null
          Copy-Item client/update-public.pem (Join-Path $updaterConfig 'client-update-public.pem')
          Copy-Item VERSION (Join-Path $updaterStage 'VERSION')
          $helperCandidate = Join-Path $stage 'helper-candidate'
          New-Item -ItemType Directory -Force -Path $helperCandidate | Out-Null
          Copy-Item (Join-Path $updaterStage '*') $helperCandidate -Recurse -Force
          $runtime = Join-Path $stage 'runtime'
          $agentRoot = Join-Path $stage 'agent'
          $agentDir = Join-Path $agentRoot 'device-agent'
          $configDir = Join-Path $stage 'config'
          $licenseDir = Join-Path $stage 'licenses'
          $nodeLicenseDir = Join-Path $licenseDir 'node'
          $dotnetLicenseDir = Join-Path $licenseDir 'dotnet'
          New-Item -ItemType Directory -Force -Path $runtime,$agentDir,$configDir,$nodeLicenseDir,$dotnetLicenseDir | Out-Null
          $nodeExe = (Get-Command node.exe).Source
          $nodeBytes = (Get-Item $nodeExe).Length
          $nodeRoot = Split-Path $nodeExe -Parent
          $dotnetExe = (Get-Command dotnet.exe).Source
          $dotnetRoot = Split-Path $dotnetExe -Parent
          Copy-Item $nodeExe (Join-Path $runtime 'node.exe')
          Copy-Item (Join-Path $nodeRoot 'LICENSE') (Join-Path $nodeLicenseDir 'LICENSE')
          Copy-Item (Join-Path $dotnetRoot 'LICENSE.txt') (Join-Path $dotnetLicenseDir 'LICENSE.txt')
          Copy-Item (Join-Path $dotnetRoot 'ThirdPartyNotices.txt') (Join-Path $dotnetLicenseDir 'ThirdPartyNotices.txt')
          npm ci --ignore-scripts
          node deploy/scripts/stage-client-core.mjs $agentRoot
          node deploy/scripts/stage-terminal-runtime.mjs $agentRoot win32 x64
          if ($LASTEXITCODE -ne 0) { throw 'canonical client core staging failed' }
          Copy-Item device-agent/install-windows-task.ps1 $agentDir
          Copy-Item client/update-public.pem (Join-Path $configDir 'client-update-public.pem')
          Copy-Item LICENSE (Join-Path $stage 'LICENSE')
          Copy-Item NOTICE (Join-Path $stage 'NOTICE')
          Copy-Item THIRD_PARTY_DISTRIBUTION_NOTICES.md (Join-Path $stage 'THIRD_PARTY_DISTRIBUTION_NOTICES.md')
          Copy-Item VERSION (Join-Path $stage 'VERSION')
          $trayBytes=(Get-Item (Join-Path $stage 'GptOperator.Client.exe')).Length
          $helperBytes=(Get-Item (Join-Path $updaterStage 'LightRemote.Updater.exe')).Length
          $stageBytes=(Get-ChildItem $stage -File -Recurse | Measure-Object Length -Sum).Sum
          $helperStageBytes=(Get-ChildItem $updaterStage -File -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "windows-size-tray-bytes=$trayBytes helper-bytes=$helperBytes node-bytes=$nodeBytes stage-bytes=$stageBytes helper-stage-bytes=$helperStageBytes"
      - name: Real Remote hidden helper smoke
        timeout-minutes: 1
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\windows\stage'
          $exe = Join-Path $stage 'GptOperator.Client.exe'
          if (-not (Test-Path $exe)) { throw 'Real Remote helper executable missing after publish' }

          $rrPsi = [System.Diagnostics.ProcessStartInfo]::new()
          $rrPsi.FileName = $exe
          $rrPsi.UseShellExecute = $false
          $rrPsi.CreateNoWindow = $true
          $rrPsi.RedirectStandardInput = $true
          $rrPsi.RedirectStandardOutput = $true
          $rrPsi.RedirectStandardError = $true
          $rrPsi.ArgumentList.Add('--real-remote-helper')
          $rr = [System.Diagnostics.Process]::new()
          $rr.StartInfo = $rrPsi
          if (-not $rr.Start()) { throw 'Real Remote helper did not start' }

          try {
            $rr.StandardInput.WriteLine('{"id":"ci-status","op":"status","args":{}}')
            $rr.StandardInput.WriteLine('{"id":"ci-windows","op":"windows","args":{"limit":5}}')
            $rr.StandardInput.Flush()

            $rrStatusLine = $rr.StandardOutput.ReadLine()
            $rrWindowsLine = $rr.StandardOutput.ReadLine()
            if ([string]::IsNullOrWhiteSpace($rrStatusLine) -or [string]::IsNullOrWhiteSpace($rrWindowsLine)) { throw 'Real Remote helper returned empty JSONL' }

            $rrStatus = $rrStatusLine | ConvertFrom-Json
            $rrWindows = $rrWindowsLine | ConvertFrom-Json
            if (-not $rrStatus.ok -or $rrStatus.result.protocolVersion -ne 1 -or $rrStatus.result.platform -ne 'win32') { throw "Real Remote status invalid: $rrStatusLine" }
            if (-not $rrWindows.ok -or $rrWindows.result.protocolVersion -ne 1 -or $rrWindows.result.count -lt 0) { throw "Real Remote windows invalid: $rrWindowsLine" }
            Write-Host "windows-real-remote-helper=PASS pid=$($rrStatus.result.processId) interactive=$($rrStatus.result.interactive) screens=$($rrStatus.result.screens.Count)"

            if ($rrStatus.result.interactive -and $rrStatus.result.screens.Count -gt 0) {
              $rr.StandardInput.WriteLine('{"id":"ci-frame","op":"frame","args":{"maxWidth":320,"maxHeight":180,"quality":30}}')
              $rr.StandardInput.Flush()
              $rrFrameLine = $rr.StandardOutput.ReadLine()
              $rrFrame = $rrFrameLine | ConvertFrom-Json
              if ($rrFrame.ok) {
                if ($rrFrame.result.mime -ne 'image/jpeg' -or $rrFrame.result.encoding -ne 'base64' -or $rrFrame.result.bytes -le 0 -or $rrFrame.result.bytes -gt 665600) { throw "Real Remote frame contract invalid: $rrFrameLine" }
                Write-Host "windows-real-remote-frame-probe=PASS width=$($rrFrame.result.width) height=$($rrFrame.result.height) bytes=$($rrFrame.result.bytes)"
              } else {
                Write-Warning "windows-real-remote-frame-probe=SKIP error=$($rrFrame.error)"
              }
            } else {
              Write-Host 'windows-real-remote-frame-probe=SKIP no-interactive-screen'
            }
          }
          finally {
            try { $rr.StandardInput.Close() } catch {}
            if (-not $rr.WaitForExit(5000)) { Stop-Process -Id $rr.Id -Force -ErrorAction SilentlyContinue }
            $rr.Dispose()
          }

      - name: Native client bundled runtime smoke
        timeout-minutes: 3
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist\windows\stage'
          $result = Join-Path $env:RUNNER_TEMP 'gpt-native-selftest.json'
          $exe = Join-Path $stage 'GptOperator.Client.exe'
          $node = Join-Path $stage 'runtime\node.exe'
          $agent = Join-Path $stage 'agent\device-agent\operator-agent.mjs'
          $agentRoot = Join-Path $stage 'agent'
          $updaterStage = Join-Path $PWD 'dist\windows\updater'
          $updater = Join-Path $updaterStage 'LightRemote.Updater.exe'
          node deploy/scripts/stage-client-core.mjs --verify $agentRoot
          if ($LASTEXITCODE -ne 0) { throw 'canonical client core verification failed' }
          if (-not (Test-Path (Join-Path $agentRoot 'client-core.json'))) { throw 'client core metadata missing' }
          if (-not (Test-Path $updater)) { throw 'independent updater publish missing' }
          foreach ($fleetFile in @('agent\device-agent\fleet-component-manager.mjs','agent\device-agent\fleet-component-supervisor.mjs')) { if (-not (Test-Path (Join-Path $stage $fleetFile))) { throw "fleet base module missing: $fleetFile" } }
          foreach ($lib in @('agent\lib\device-proof.mjs','agent\lib\native-fs.mjs','agent\lib\native-process.mjs','agent\lib\native-terminal.mjs','agent\lib\native-search.mjs','agent\lib\light-scp-file.mjs','agent\lib\light-scp-registry.mjs','agent\lib\update-contract.mjs','agent\lib\runtime-version.mjs')) { if (-not (Test-Path (Join-Path $stage $lib))) { throw "agent runtime lib missing: $lib" } }
          foreach ($notice in @('LICENSE','NOTICE','THIRD_PARTY_DISTRIBUTION_NOTICES.md','licenses\node\LICENSE','licenses\dotnet\LICENSE.txt','licenses\dotnet\ThirdPartyNotices.txt','THIRD_PARTY_NOTICES.txt')) {
            $noticePath = Join-Path $stage $notice
            if (-not (Test-Path $noticePath) -or (Get-Item $noticePath).Length -lt 100) { throw "bundled notice missing/empty: $notice" }
          }
          Write-Host 'windows-bundled-runtime-notices=PASS'
          if (-not (Test-Path (Join-Path $agentRoot 'licenses\terminal-runtime\node-pty-LICENSE'))) { throw 'terminal runtime license missing' }
          node deploy/scripts/terminal-runtime-smoke.mjs $agentRoot
          if ($LASTEXITCODE -ne 0) { throw 'windows terminal runtime smoke failed' }
          $env:OPERATOR_AGENT_STATE = Join-Path $env:RUNNER_TEMP 'native-empty-device.json'
          Write-Host '--- bundled agent direct status ---'
          & $node $agent status
          if ($LASTEXITCODE -ne 0) { throw 'bundled agent direct status failed' }
          Write-Host '--- native client self-test ---'
          $self = Start-Process -FilePath $exe -ArgumentList @('--self-test-output',$result) -PassThru
          if (-not $self.WaitForExit(30000)) { Stop-Process -Id $self.Id -Force -ErrorAction SilentlyContinue; throw 'native client bundled self-test timed out after 30s' }
          $selfExit = $self.ExitCode
          if (Test-Path $result) { Get-Content $result -Raw | Write-Host }
          if ($selfExit -ne 0) { throw "native client self-test failed exit=$selfExit" }
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "self-test not ok: $(Get-Content $result -Raw)" }
          if ($json.platformAdapter -ne 'win32') { throw "expected win32 adapter, got $($json.platformAdapter)" }
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $coreMeta = Get-Content (Join-Path $agentRoot 'client-core.json') -Raw | ConvertFrom-Json
          if ($coreMeta.version -ne $expectedVersion) { throw "canonical client core version mismatch: $($coreMeta.version) expected=$expectedVersion" }
          if ($json.clientVersion -ne $expectedVersion) { throw "client version mismatch: $($json.clientVersion) expected=$expectedVersion" }
          if ($json.agentVersion -ne $expectedVersion) { throw "bundled agent version mismatch: $($json.agentVersion) expected=$expectedVersion" }
          Write-Host "windows-tray-selftest=PASS agent=$($json.agentVersion) adapter=$($json.platformAdapter)"

          $updaterSelfResult = Join-Path $env:RUNNER_TEMP 'updater-selftest.json'
          $updaterSelf = Start-Process -FilePath $updater -ArgumentList @('--self-test-output',$updaterSelfResult,$stage) -PassThru
          if (-not $updaterSelf.WaitForExit(30000)) { Stop-Process -Id $updaterSelf.Id -Force -ErrorAction SilentlyContinue; throw 'independent updater self-test timed out after 30s' }
          if (Test-Path $updaterSelfResult) { Get-Content $updaterSelfResult -Raw | Write-Host }
          if ($updaterSelf.ExitCode -ne 0) { throw "independent updater self-test failed exit=$($updaterSelf.ExitCode)" }
          $updaterSelfJson = Get-Content $updaterSelfResult -Raw | ConvertFrom-Json
          if (-not $updaterSelfJson.ok -or -not $updaterSelfJson.updaterOutsideApp -or $updaterSelfJson.runtime -ne 'independent-updater') { throw "independent updater self-test invalid: $(Get-Content $updaterSelfResult -Raw)" }
          Write-Host 'windows-independent-updater-selftest=PASS'

          $manifestFixture = (Resolve-Path 'deploy/fixtures/client-update-test.json').Path
          $manifestHash = (Get-FileHash $manifestFixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -ne '48790b1532b863cb471bfcf68ff5f4a87fa0497e270bec5abbde254acf5d18e7') { throw "signed fixture byte hash changed: $manifestHash" }
          Write-Host "windows-signed-fixture-bytes=PASS sha256=$manifestHash"
          $sigResult = Join-Path $env:RUNNER_TEMP 'gpt-update-signature.json'
          $sig = Start-Process -FilePath $updater -ArgumentList @('--verify-update-fixture',$manifestFixture,(Resolve-Path 'deploy/fixtures/client-update-test.json.sig').Path,$sigResult) -PassThru
          if (-not $sig.WaitForExit(30000)) { Stop-Process -Id $sig.Id -Force -ErrorAction SilentlyContinue; throw 'signed update fixture verification timed out after 30s' }
          if (Test-Path $sigResult) { Get-Content $sigResult -Raw | Write-Host }
          if ($sig.ExitCode -ne 0) { throw "signed update fixture verification failed exit=$($sig.ExitCode)" }
          $sigJson = Get-Content $sigResult -Raw | ConvertFrom-Json
          if (-not $sigJson.ok) { throw "update signature fixture invalid: $(Get-Content $sigResult -Raw)" }
          $tampered = Join-Path $env:RUNNER_TEMP 'client-update-tampered.json'
          (Get-Content deploy/fixtures/client-update-test.json -Raw).Replace('99.0.0','99.0.1') | Set-Content -LiteralPath $tampered -NoNewline -Encoding utf8
          $tamperedResult = Join-Path $env:RUNNER_TEMP 'tampered-result.json'
          $bad = Start-Process -FilePath $updater -ArgumentList @('--verify-update-fixture',$tampered,(Resolve-Path 'deploy/fixtures/client-update-test.json.sig').Path,$tamperedResult) -PassThru
          if (-not $bad.WaitForExit(30000)) { Stop-Process -Id $bad.Id -Force -ErrorAction SilentlyContinue; throw 'tampered update fixture probe timed out after 30s' }
          if ($bad.ExitCode -eq 0) { throw 'tampered update manifest was accepted' }
          Write-Host 'windows-independent-update-signature=PASS tamper-rejected=PASS'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build per-user installer
        shell: pwsh
        run: |
          $stage = (Resolve-Path 'dist\windows\stage').Path
          $out = Join-Path $PWD 'dist\windows\installer'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $version = (Get-Content VERSION -Raw).Trim()
          & $env:ISCC "/DStageDir=$stage" "/DOutputDir=$out" "/DAppVersion=$version" client/windows-native/installer/GptOperator.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed' }
          $installer = Join-Path $out 'Light-Remote-MCP-Setup-x64.exe'
          if (-not (Test-Path $installer)) { throw 'installer missing' }
          $installerBytes=(Get-Item $installer).Length
          Write-Host "windows-size-installer-bytes=$installerBytes"
          "WINDOWS_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build compact web installer
        shell: pwsh
        run: |
          $stage = (Resolve-Path 'dist\windows\stage').Path
          $out = Join-Path $PWD 'dist\windows\installer'
          $version = (Get-Content VERSION -Raw).Trim()
          $compact = & client/windows-native/installer/build-compact.ps1 -StageDir $stage -OutputDir $out -AppVersion $version -Iscc $env:ISCC | Select-Object -Last 1
          if (-not (Test-Path $compact)) { throw "compact installer missing: $compact" }
          $compactBytes=(Get-Item $compact).Length
          $fullBytes=(Get-Item $env:WINDOWS_INSTALLER).Length
          if ($compactBytes -ge $fullBytes) { throw "compact installer is not smaller: compact=$compactBytes full=$fullBytes" }
          Write-Host "windows-compact-vs-full-bytes=$compactBytes/$fullBytes"
          "WINDOWS_COMPACT_INSTALLER=$compact" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install tray, background agent and updater tasks
        timeout-minutes: 4
        shell: pwsh
        run: |
          $legacyName = 'GPTOperatorDeviceAgent'
          $legacyAction = New-ScheduledTaskAction -Execute (Join-Path $env:SystemRoot 'System32\cmd.exe') -Argument '/c ping 127.0.0.1 -t'
          $legacyTrigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddHours(1)
          $legacyPrincipal = New-ScheduledTaskPrincipal -UserId ([System.Security.Principal.WindowsIdentity]::GetCurrent().Name) -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName $legacyName -Action $legacyAction -Trigger $legacyTrigger -Principal $legacyPrincipal -Force | Out-Null
          Start-ScheduledTask -TaskName $legacyName
          Start-Sleep -Milliseconds 500

          $installDir = Join-Path $env:RUNNER_TEMP 'GPT Operator Installed'
          $dirArg = '/DIR="' + $installDir + '"'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',$dirArg)
          Write-Host "windows-native-install-start dir=$installDir"
          $p = Start-Process -FilePath $env:WINDOWS_INSTALLER -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'installer timed out after 120s' }
          if ($p.ExitCode -ne 0) { throw "installer exit=$($p.ExitCode)" }
          if (Get-ScheduledTask -TaskName $legacyName -ErrorAction SilentlyContinue) { throw 'legacy scheduled task survived native install' }
          $exe = Join-Path $installDir 'GptOperator.Client.exe'
          if (-not (Test-Path $exe)) { throw "installed client missing: $exe" }
          foreach ($notice in @('LICENSE','NOTICE','THIRD_PARTY_DISTRIBUTION_NOTICES.md','licenses\node\LICENSE','licenses\dotnet\LICENSE.txt','licenses\dotnet\ThirdPartyNotices.txt','THIRD_PARTY_NOTICES.txt')) {
            $noticePath = Join-Path $installDir $notice
            if (-not (Test-Path $noticePath) -or (Get-Item $noticePath).Length -lt 100) { throw "installed notice missing/empty: $notice" }
          }
          Write-Host 'windows-installed-runtime-notices=PASS'
          $version = (Get-Content VERSION -Raw).Trim()
          $updaterRoot = Join-Path $env:LOCALAPPDATA 'Light Remote\Updater'
          $updaterExe = Join-Path $updaterRoot 'LightRemote.Updater.exe'
          if (-not (Test-Path $updaterExe)) { throw "independent updater missing: $updaterExe" }
          $rollback = Join-Path $updaterRoot ("rollback\Light-Remote-MCP-Setup-$version-x64.exe")
          if (-not (Test-Path $rollback)) { throw "rollback installer cache missing: $rollback" }
          "WINDOWS_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_ROLLBACK=$rollback" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_UPDATER=$updaterExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $agentTask = Get-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -ErrorAction Stop
          $updateTask = Get-ScheduledTask -TaskName 'LightRemoteUpdater' -ErrorAction Stop
          Start-Sleep -Milliseconds 800
          $agentInfo = Get-ScheduledTaskInfo -TaskName 'LightRemoteDeviceAgent'
          if ($agentTask.State -ne 'Running') { throw "LightRemoteDeviceAgent not running: $($agentTask.State) result=$($agentInfo.LastTaskResult)" }
          if ($updateTask.TaskName -ne 'LightRemoteUpdater') { throw 'LightRemoteUpdater missing' }
          $updateAction = @($updateTask.Actions)[0]
          if ([IO.Path]::GetFullPath($updateAction.Execute) -ne [IO.Path]::GetFullPath($updaterExe)) { throw "updater task is not independent: $($updateAction.Execute)" }
          if ($updateAction.Arguments -notmatch '--scheduled-update' -or $updateAction.Arguments -notmatch '--install-dir') { throw "updater task arguments invalid: $($updateAction.Arguments)" }
          if ([IO.Path]::GetFullPath($updaterExe).StartsWith([IO.Path]::GetFullPath($installDir), [StringComparison]::OrdinalIgnoreCase)) { throw 'updater executable lives inside replaceable app tree' }
          $agentAction = @($agentTask.Actions)[0]
          if ([IO.Path]::GetFileName($agentAction.Execute) -ne 'GptOperator.Client.exe') { throw "agent task must use hidden native host, got $($agentAction.Execute)" }
          if ($agentAction.Arguments -notmatch '--agent-host') { throw "agent task missing --agent-host: $($agentAction.Arguments)" }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 5491 -InformationLevel Quiet)) { throw 'Local Wall 5491 not listening after install' }
          $runtimeNode = Join-Path $installDir 'runtime\node.exe'
          $agentNodes = @(Get-Process node -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $runtimeNode })
          if (-not $agentNodes) { throw 'hidden agent node process missing' }
          if ($agentNodes | Where-Object { $_.MainWindowHandle -ne 0 }) { throw 'agent node unexpectedly owns a visible console window' }
          $trayProbe = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Milliseconds 900
          Stop-Process -Id $trayProbe.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500
          if ((Get-ScheduledTask -TaskName 'LightRemoteDeviceAgent').State -ne 'Running') { throw 'closing tray stopped background agent task' }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 5491 -InformationLevel Quiet)) { throw 'closing tray stopped Local Wall 5491' }
          $relaunchedTray = Start-Process -FilePath $exe -ArgumentList @('--launch') -PassThru
          Start-Sleep -Milliseconds 1200
          if ($relaunchedTray.HasExited) { throw 'desktop launcher did not restore the tray process' }
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 5491 -InformationLevel Quiet)) { throw 'desktop launcher disturbed Local Wall 5491' }
          Write-Host 'windows-agent-hidden-console=PASS'
          Write-Host 'windows-tray-exit-agent-survival=PASS'
          Write-Host 'windows-tray-relaunch=PASS'
          Stop-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -ErrorAction SilentlyContinue
          $taskStopDeadline = (Get-Date).AddSeconds(10)
          do {
            $agentTaskState = (Get-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -ErrorAction Stop).State
            if ($agentTaskState -ne 'Running') { break }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $taskStopDeadline)
          if ($agentTaskState -eq 'Running') { throw 'agent scheduled task did not stop for updater independence probe' }
          Get-Process -Name 'GptOperator.Client','node' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $exe -or $_.Path -eq $runtimeNode } catch { $false } } | Stop-Process -Force -ErrorAction SilentlyContinue
          $agentExitDeadline = (Get-Date).AddSeconds(10)
          do {
            $runtimeStillRunning = @(Get-Process -Name 'GptOperator.Client','node' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $exe -or $_.Path -eq $runtimeNode } catch { $false } })
            if (-not $runtimeStillRunning) { break }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $agentExitDeadline)
          if ($runtimeStillRunning) { throw 'app runtime did not quiesce for updater independence probe' }
          $heldExe = "$exe.app-held"
          Move-Item $exe $heldExe -Force
          try {
            $recoveryResult = Join-Path $env:RUNNER_TEMP 'updater-app-missing-selftest.json'
            $recovery = Start-Process -FilePath $updaterExe -ArgumentList @('--self-test-output',$recoveryResult,$installDir) -PassThru -Wait
            if ($recovery.ExitCode -ne 0) { throw "updater failed while app executable missing exit=$($recovery.ExitCode)" }
            $recoveryJson = Get-Content $recoveryResult -Raw | ConvertFrom-Json
            if (-not $recoveryJson.ok -or -not $recoveryJson.updaterOutsideApp) { throw "updater recovery self-test invalid: $(Get-Content $recoveryResult -Raw)" }
            Write-Host 'windows-updater-survives-app-missing=PASS'
          } finally { Move-Item $heldExe $exe -Force }
          Start-ScheduledTask -TaskName 'LightRemoteDeviceAgent'
          Start-Sleep -Milliseconds 700
          if ((Get-ScheduledTask -TaskName 'LightRemoteDeviceAgent').State -ne 'Running') { throw 'agent did not restart after updater independence probe' }
          Write-Host 'windows-background-agent-task=PASS'
          Write-Host 'windows-independent-updater-task=PASS'
          Write-Host 'windows-native-legacy-task-migration=PASS'

      - name: Installed tray client self-test
        timeout-minutes: 2
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'installed-selftest.json'
          Write-Host 'windows-native-installed-selftest=start'
          $p = Start-Process -FilePath $env:WINDOWS_INSTALLED_EXE -ArgumentList @('--self-test-output',$result) -PassThru
          if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'installed client self-test timed out after 30s' }
          if ($p.ExitCode -ne 0) { throw "installed client self-test failed exit=$($p.ExitCode)" }
          $json = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $json.ok -or $json.platformAdapter -ne 'win32') { throw "installed client invalid: $(Get-Content $result -Raw)" }
          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          if ($json.agentVersion -ne $expectedVersion) { throw "installed agent version mismatch: $($json.agentVersion) expected=$expectedVersion" }
          Write-Host 'windows-native-installed-selftest=PASS'

      - name: Broken update rollback smoke
        timeout-minutes: 5
        shell: pwsh
        run: |
          $badInstaller = Join-Path $env:RUNNER_TEMP 'broken-update.exe'
          Copy-Item (Join-Path $env:SystemRoot 'System32\where.exe') $badInstaller -Force
          $helper = Join-Path $env:RUNNER_TEMP 'light-remote-update-helper.exe'
          Copy-Item $env:WINDOWS_UPDATER $helper -Force
          $updateLog = Join-Path $env:LOCALAPPDATA 'Light Remote\Updater\logs\update.log'
          Remove-Item $updateLog -Force -ErrorAction SilentlyContinue
          Write-Host 'windows-independent-update-rollback=start'
          $psi = [System.Diagnostics.ProcessStartInfo]::new($helper)
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.ArgumentList.Add('--apply-update')
          $psi.ArgumentList.Add($badInstaller)
          $psi.ArgumentList.Add($env:WINDOWS_INSTALL_DIR)
          $currentVersion = (Get-Content VERSION -Raw).Trim()
          $psi.ArgumentList.Add($currentVersion)
          $psi.ArgumentList.Add('0')
          $psi.ArgumentList.Add('99.0.0')
          $psi.ArgumentList.Add('ut_cirollback_1234567890')
          $p = [System.Diagnostics.Process]::Start($psi)
          if (-not $p.WaitForExit(180000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $updateLog) { Get-Content $updateLog -Raw | Write-Host }
            throw 'rollback helper timed out after 180s'
          }
          if (Test-Path $updateLog) { Get-Content $updateLog -Raw | Write-Host }
          if ($p.ExitCode -ne 0) { throw "rollback helper failed exit=$($p.ExitCode)" }
          $updateText = Get-Content $updateLog -Raw
          $expected = 'apply_start current=' + [regex]::Escape($currentVersion)
          if ($updateText -notmatch $expected) { throw 'rollback helper argv were not preserved' }
          if ($updateText -notmatch 'rollback_success') { throw 'rollback success marker missing' }
          if (-not (Test-Path $env:WINDOWS_INSTALLED_EXE)) { throw 'installed client missing after rollback' }
          Write-Host 'windows-independent-update-rollback=PASS'

      - name: Uninstall native Windows client
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          Stop-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -ErrorAction SilentlyContinue
          if ($env:WINDOWS_INSTALL_DIR) {
            $fullExe = Join-Path $env:WINDOWS_INSTALL_DIR 'GptOperator.Client.exe'
            $fullNode = Join-Path $env:WINDOWS_INSTALL_DIR 'runtime\node.exe'
            Get-Process -Name 'GptOperator.Client','node' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $fullExe -or $_.Path -eq $fullNode } catch { $false } } | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Get-Process -Name 'LightRemote.Updater','light-remote-update-helper' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'GPTOperatorDeviceAgent' -Confirm:$false -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -Confirm:$false -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'LightRemoteUpdater' -Confirm:$false -ErrorAction SilentlyContinue
          if ($env:WINDOWS_INSTALL_DIR) {
            $unins = Join-Path $env:WINDOWS_INSTALL_DIR 'unins000.exe'
            if (Test-Path $unins) {
              $p = Start-Process -FilePath $unins -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
              if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'uninstaller timed out after 60s' }
              if ($p.ExitCode -ne 0) { throw "uninstaller exit=$($p.ExitCode)" }
            }
            $updaterRoot = Join-Path $env:LOCALAPPDATA 'Light Remote\Updater'
            if (Test-Path $updaterRoot) { throw "updater recovery root survived uninstall: $updaterRoot" }
            Write-Host 'windows-native-installer-roundtrip=PASS'
          } else {
            Write-Host 'windows-native-installer-roundtrip=SKIP install-not-reached'
          }
      - name: Install compact web client and verify runtime cache
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'Light Remote Compact Installed'
          $log1 = Join-Path $env:RUNNER_TEMP 'compact-install-download.log'
          $dirArg = '/DIR="' + $installDir + '"'
          $logArg = '/LOG="' + $log1 + '"'
          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',$dirArg,$logArg)
          $p = Start-Process -FilePath $env:WINDOWS_COMPACT_INSTALLER -ArgumentList $args -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'compact installer timed out after 180s' }
          if ($p.ExitCode -ne 0) { if(Test-Path $log1){Get-Content $log1 -Raw|Write-Host}; throw "compact installer exit=$($p.ExitCode)" }
          $node = Join-Path $installDir 'runtime\node.exe'
          if (-not(Test-Path $node)) { throw 'compact installer did not provision Node runtime' }
          $nodeVersion = (& $node --version).Trim()
          if ($nodeVersion -ne 'v22.23.2') { throw "compact Node version mismatch: $nodeVersion" }
          $cache = Join-Path $env:LOCALAPPDATA 'Light Remote\Updater\runtime-cache\node-v22.23.2-win-x64.zip'
          if (-not(Test-Path $cache)) { throw "compact Node cache missing: $cache" }
          $cacheHash=(Get-FileHash $cache -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($cacheHash -ne '1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97') { throw "compact Node cache hash mismatch: $cacheHash" }
          if ((Get-Content $log1 -Raw) -notmatch 'compact-node-source=download') { throw 'compact first install did not use verified download path' }
          $log2 = Join-Path $env:RUNNER_TEMP 'compact-install-cache.log'
          $logArg2 = '/LOG="' + $log2 + '"'
          $args2 = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',$dirArg,$logArg2)
          $p2 = Start-Process -FilePath $env:WINDOWS_COMPACT_INSTALLER -ArgumentList $args2 -PassThru
          if (-not $p2.WaitForExit(180000)) { Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue; throw 'compact cache reinstall timed out after 180s' }
          if ($p2.ExitCode -ne 0) { if(Test-Path $log2){Get-Content $log2 -Raw|Write-Host}; throw "compact cache reinstall exit=$($p2.ExitCode)" }
          if ((Get-Content $log2 -Raw) -notmatch 'compact-node-source=cache') { throw 'compact reinstall did not reuse verified Node cache' }
          $exe = Join-Path $installDir 'GptOperator.Client.exe'
          $result = Join-Path $env:RUNNER_TEMP 'compact-installed-selftest.json'
          $self = Start-Process -FilePath $exe -ArgumentList @('--self-test-output',$result) -PassThru -Wait
          if ($self.ExitCode -ne 0) { throw "compact installed self-test failed exit=$($self.ExitCode)" }
          $json=Get-Content $result -Raw|ConvertFrom-Json
          $expected=(Get-Content VERSION -Raw).Trim()
          if (-not $json.ok -or $json.agentVersion -ne $expected -or $json.platformAdapter -ne 'win32') { throw "compact installed self-test invalid: $(Get-Content $result -Raw)" }
          Start-Sleep -Milliseconds 700
          $compactTask = Get-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -ErrorAction Stop
          if ($compactTask.State -ne 'Running') {
            $compactInfo = Get-ScheduledTaskInfo -TaskName 'LightRemoteDeviceAgent' -ErrorAction SilentlyContinue
            $agentLog = Join-Path $env:LOCALAPPDATA 'GPTOperatorAgent\logs\agent.log'
            if (Test-Path $agentLog) { Get-Content $agentLog -Tail 80 | Write-Host }
            throw "compact background agent is not running: state=$($compactTask.State) result=$($compactInfo.LastTaskResult)"
          }
          if (-not(Test-NetConnection -ComputerName 127.0.0.1 -Port 5491 -InformationLevel Quiet)) { throw 'compact Local Wall 5491 not listening' }
          Write-Host 'windows-compact-node-download-verify=PASS'
          Write-Host 'windows-compact-node-cache-reuse=PASS'
          Write-Host 'windows-compact-installed-selftest=PASS'
          "WINDOWS_COMPACT_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Uninstall compact Windows client
        if: always()
        timeout-minutes: 3
        shell: pwsh
        run: |
          Stop-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -ErrorAction SilentlyContinue
          $compactDir = $env:WINDOWS_COMPACT_INSTALL_DIR
          if ([string]::IsNullOrWhiteSpace($compactDir)) { $compactDir = Join-Path $env:RUNNER_TEMP 'Light Remote Compact Installed' }
          $compactExe = Join-Path $compactDir 'GptOperator.Client.exe'
          $compactNode = Join-Path $compactDir 'runtime\node.exe'
          Get-Process -Name 'GptOperator.Client','node' -ErrorAction SilentlyContinue | Where-Object { try { $_.Path -eq $compactExe -or $_.Path -eq $compactNode } catch { $false } } | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name 'LightRemote.Updater' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'LightRemoteDeviceAgent' -Confirm:$false -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName 'LightRemoteUpdater' -Confirm:$false -ErrorAction SilentlyContinue
          $unins = Join-Path $compactDir 'unins000.exe'
          if (Test-Path $unins) {
            $p = Start-Process -FilePath $unins -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'compact uninstaller timed out after 60s' }
            if ($p.ExitCode -ne 0) { throw "compact uninstaller exit=$($p.ExitCode)" }
          }
          $updaterRoot = Join-Path $env:LOCALAPPDATA 'Light Remote\Updater'
          if (Test-Path $updaterRoot) { throw "compact updater recovery root survived uninstall: $updaterRoot" }
          Write-Host 'windows-compact-installer-roundtrip=PASS'

      - name: Hash Windows installers
        shell: pwsh
        run: |
          $fullHash = (Get-FileHash $env:WINDOWS_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          $compactHash = (Get-FileHash $env:WINDOWS_COMPACT_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant()
          $sum = Join-Path (Split-Path $env:WINDOWS_INSTALLER -Parent) 'SHA256SUMS.txt'
          @("$fullHash  Light-Remote-MCP-Setup-x64.exe","$compactHash  Light-Remote-MCP-Compact-Setup-x64.exe") | Set-Content -LiteralPath $sum -Encoding ascii
          Write-Host "windows-native-installer-sha256=$fullHash"
          Write-Host "windows-compact-installer-sha256=$compactHash"

      - name: Upload native Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: light-remote-windows-x64-${{ github.sha }}
          path: |
            dist/windows/installer/Light-Remote-MCP-Setup-x64.exe
            dist/windows/installer/Light-Remote-MCP-Compact-Setup-x64.exe
            dist/windows/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
