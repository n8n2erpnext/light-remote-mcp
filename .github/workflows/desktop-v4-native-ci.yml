name: Desktop V4 UI and Tauri 2 Pilot CI

on:
  workflow_dispatch:
  push:
    branches:
      - feat/desktop-v4-shared-ui-20261101
      - feat/desktop-v4-wall-activity-20261102
      - feat/desktop-v4-login-entry-20261103
      - feat/desktop-v4-api-integration-20261103
    paths:
      - client/desktop-v4/**
      - .github/workflows/desktop-v4-native-ci.yml
  pull_request:
    paths:
      - client/desktop-v4/**
      - .github/workflows/desktop-v4-native-ci.yml

permissions:
  contents: read

concurrency:
  group: desktop-v4-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-test-visual:
    name: Web build, tests, isolated browser screenshots
    env:
      VITE_LR_V4_UI_TEST: '1' # Signed-off UI-only test artifact; production omits this
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client/desktop-v4
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Node 22 with scoped npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/desktop-v4/package-lock.json
      - name: Reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and production Vite build
        run: npm run build
      - name: Unit, rendered UI and native-shell security tests
        run: npm test
      - name: Desktop Owner PKCE callback security contract tests (default OFF)
        run: node --test ../../plugin-server/desktop-auth-v4-contract.test.mjs ../../plugin-server/desktop-auth-v4-server.test.mjs ../../plugin-server/desktop-owner-token-v4.test.mjs
      - name: Install Chromium on GitHub runner (never VPS-ARM)
        run: npx playwright install --with-deps chromium
      - name: Pixel/browser QA for exact Figma sizes and intermediate widths
        run: npm run test:visual
        env:
          LR_V4_VISUAL_OUT: ${{ runner.temp }}/light-remote-v4-ui-evidence
      - name: Upload screenshots and geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v4-chromium-ui-${{ github.run_id }}
          path: ${{ runner.temp }}/light-remote-v4-ui-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify feature-gated Owner Login React bundle (no native release)
        run: npm run build
        env:
          VITE_LR_V4_UI_TEST: '0'
          VITE_LR_V4_OWNER_LOGIN: '1'
      - name: Reject dev-server-only Owner candidate packaging
        run: node e2e/tauri-production-packaging-contract.mjs

  native-shell:
    env:
      VITE_LR_V4_UI_TEST: '1' # UI-only test artifact; no Owner credential bridge
      LR_V4_WALL_PROFILE: 'goldabv2-lab' # exact NetBird Lab Wall, never ChatGPT MCP
    name: Tauri 2 UI-only native build / ${{ matrix.os }}
    needs: web-test-visual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    defaults:
      run:
        working-directory: client/desktop-v4
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Node 22 with scoped npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/desktop-v4/package-lock.json
      - name: Linux Tauri GTK + WebKit dependencies (GitHub runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libssl-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust compilation only on GitHub
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/desktop-v4/src-tauri -> target
          cache-on-failure: false
      - name: Reproducible JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Build native Tauri UI-only executable, no installer/bundle
        run: npm run tauri:build
      - name: Candidate Owner OS secure-vault compile and Rust unit tests (no actual credentials)
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-owner-login --bin light-remote-desktop-v4-pilot

      - name: Verify native executable and SHA256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = 'src-tauri/target/release/light-remote-desktop-v4-pilot.exe'
          if (-not (Test-Path $f)) { throw 'Tauri Windows executable missing' }
          Get-FileHash -Algorithm SHA256 $f | Format-List
      - name: Verify native executable and SHA256 (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          f='src-tauri/target/release/light-remote-desktop-v4-pilot'
          test -s "$f"
          shasum -a 256 "$f"
      - name: Upload unsigned UI-only binary for isolated QA
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v4-tauri-pilot-goldabv2-lab-${{ matrix.os }}-${{ github.run_id }}
          path: |
            client/desktop-v4/src-tauri/target/release/light-remote-desktop-v4-pilot
            client/desktop-v4/src-tauri/target/release/light-remote-desktop-v4-pilot.exe
          if-no-files-found: error
          retention-days: 7

  owner-login-lab-candidate:
    # Explicitly isolated unsigned QA artifacts. This does not replace the
    # default UI-only executable and never publishes an installer or release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/desktop-v4-api-integration-20261103'
    name: Owner Login LAB candidate (unsigned) / ${{ matrix.os }}
    needs: web-test-visual
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    env:
      VITE_LR_V4_UI_TEST: '0'
      VITE_LR_V4_OWNER_LOGIN: '1'
      LR_V4_WALL_PROFILE: 'goldabv2-lab'
    defaults:
      run:
        working-directory: client/desktop-v4
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/desktop-v4/package-lock.json
      - name: Linux Tauri and OS-vault dependencies (GitHub runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libssl-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache isolated Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/desktop-v4/src-tauri -> target
          cache-on-failure: false
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Build real Owner Login frontend (NO design preview)
        run: npm run build
      - name: Verify standalone frontend packaging contract
        run: node e2e/tauri-production-packaging-contract.mjs
      - name: Build feature-enabled native candidate with EMBEDDED frontend (NO installer)
        # Raw `cargo build --release` bypasses Tauri's production asset
        # pipeline: Windows WebView2 then navigates to 127.0.0.1:5174
        # (the Vite dev URL), causing ERR_CONNECTION_REFUSED.
        # The Tauri CLI embeds ../dist into this standalone release executable.
        run: npm exec -- tauri build --no-bundle --features desktop-owner-login --ci
      - name: Verify candidate SHA256 Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $f = 'src-tauri/target/release/light-remote-desktop-v4-pilot.exe'
          if (-not (Test-Path $f)) { throw 'Owner LAB candidate missing' }
          Get-FileHash -Algorithm SHA256 $f | Format-List
      - name: Verify candidate SHA256 macOS or Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          f='src-tauri/target/release/light-remote-desktop-v4-pilot'
          test -s "$f"
          shasum -a 256 "$f"
      - name: Upload separately labeled UNSIGNED NON-PRODUCTION candidate
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v4-owner-login-LAB-UNSIGNED-NO-PRODUCTION-${{ matrix.os }}-${{ github.run_id }}
          path: |
            client/desktop-v4/src-tauri/target/release/light-remote-desktop-v4-pilot
            client/desktop-v4/src-tauri/target/release/light-remote-desktop-v4-pilot.exe
          if-no-files-found: error
          retention-days: 3
