<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Light Remote — Create account</title><link rel="stylesheet" href="/assets/light-remote-portal.css"></head><body><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><img src="/assets/branding/light-remote-mark.svg" alt=""><div><strong>Light Remote</strong><div class="muted">Remote MCP</div></div></div><h1>Create account</h1><p>One account owns your devices, permissions and approved AI connections.</p><form id="form"><label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required autofocus></label><label class="field"><span>Password</span><input name="password" type="password" autocomplete="new-password" minlength="10" required></label><label class="field"><span>Confirm password</span><input name="confirm" type="password" autocomplete="new-password" minlength="10" required></label><label class="field"><span>Current Wall password</span><input name="ownerPassword" type="password" autocomplete="current-password" required></label><div class="muted" style="margin-top:8px">One-time owner migration proof. It is verified by the current Light Remote Server and is never stored in the account registry.</div><div id="error" class="error"></div><div class="auth-actions"><button class="btn primary" type="submit">Create account</button></div></form><div class="auth-switch">Already registered? <a href="/login/">Sign in</a></div></section></main><script>
const form=document.getElementById('form'),error=document.getElementById('error');fetch('/api/auth?action=me',{cache:'no-store'}).then(r=>{if(r.ok)location.href='/';}).catch(()=>{});form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button'),fd=new FormData(form),password=String(fd.get('password')||'');error.textContent='';if(password!==String(fd.get('confirm')||'')){error.textContent='Passwords do not match';return;}b.disabled=true;try{const r=await fetch('/api/auth?action=register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:fd.get('email'),password,ownerPassword:fd.get('ownerPassword')})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Registration failed');location.href='/';}catch(err){error.textContent=err.message;}finally{b.disabled=false;}};
</script></body></html>
